<style>

@media(min-width:600px){body{background:var(--s1)}#app{border-inline:1px solid var(--ln)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 6px max(16px,env(safe-area-inset-left))}

s by exploding forward and outward with the hips while pushing the ball as far as possible.\nChest Push from 3 Point Stance (Medicine Ball)|Chest|Medicine Ball|wr|Begin in a three point stance, squatted down with your back flat and one hand on the ground. Place the medicine ball directly in front of you. To begin, take your first step as you pull the ball to your chest, positioning both hands to prepare for the throw.\nChest Push with Run Release (Medicine Ball)|Chest|Medicine Ball|wr|Begin in an athletic stance with the knees bent, hips back, and back flat. Hold the medicine ball near your legs. While taking your first step draw the medicine ball into your chest.\nCircus Bell|Shoulders|Other|bw|The circus bell is an oversized dumbbell with a thick handle. Begin with the dumbbell between your feet, and grip the handle with both hands.\nClean (Barbell)|Hamstrings|Barbell|wr|With a barbell on the floor close to the shins, take an overhand (or hook) grip just outside the legs. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar.\nClean Deadlift (Barbell)|Hamstrings|Barbell|wr|Begin standing with a barbell close to your shins. Your feet should be directly under your hips with your feet turned out slightly. Grip the bar with a double overhand grip or hook grip, about shoulder width apart. Squat down to the bar.\nClean Pull (Barbell)|Quads|Barbell|wr|With a barbell on the floor close to the shins, take an overhand or hook grip just outside the legs. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar.\nClean Shrug (Barbell)|Traps|Barbell|wr|Begin with a shoulder width, double overhand or hook grip, with the bar hanging at the mid thigh position. Your back should be straight and inclined slightly forward. Shrug your shoulders towards your ears.\nClean and Jerk (Barbell)|Shoulders|Barbell|wr|With a barbell on the floor close to the shins, take an overhand or hook grip just outside the legs. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar.\nClean and Press (Barbell)|Shoulders|Barbell|wr|Assume a shoulder-width stance, with knees inside the arms. Now while keeping the back flat, bend at the knees and hips so that you can grab the bar with the arms fully extended and a pronated grip that is slightly wider than shoulder width.\nClean from Blocks (Barbell)|Quads|Barbell|wr|With a barbell on boxes or stands of the desired height, take an overhand or hook grip just outside the legs. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar.\nClock Push Up|Chest|Bodyweight|bw|Move into a prone position on the floor, supporting your weight on your hands and toes. Your arms should be fully extended with the hands around shoulder width. Keep your body straight throughout the movement.\nClose-Grip Press (Dumbbell)|Triceps|Dumbbell|wr|Place a dumbbell standing up on a flat bench. Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench with only your shoulders lying on the surface.\nClose-Grip Ez Bar Curl (Barbell)|Biceps|Barbell|wr|Stand up with your torso upright while holding an E-Z Curl Bar at the closer inner handle. The palm of your hands should be facing forward and they should be slightly tilted inwards due to the shape of the bar. The elbows should be close to the torso.\nClose-Grip Curl with Band (EZ Bar)|Biceps|EZ Bar|wr|Attach a band to each end of the bar. Take the bar, placing a foot on the middle of the band. Stand upright with a narrow, supinated grip on the EZ bar. The elbows should be close to the torso.\nClose-Grip Press (EZ Bar)|Triceps|EZ Bar|wr|Lie on a flat bench with an EZ bar loaded to an appropriate weight. Using a narrow grip lift the bar and hold it straight over your torso with your elbows in. The arms should be perpendicular to the floor.\nClose-Grip Front Lat Pulldown (Cable)|Back|Cable|wr|Sit down on a pull-down machine with a wide bar attached to the top pulley. Make sure that you adjust the knee pad of the machine to fit your height. These pads will prevent your body from being raised by the resistance attached to the bar.\nClose-Grip Push Up off of a Dumbbell|Triceps|Bodyweight|bw|Lie on the floor and place your hands on an upright dumbbell. Supporting your weight on your toes and hands, keep your torso rigid and your elbows in with your arms straight. Lower your body, allowing the elbows to flex while you inhale.\nClose-Grip Standing Curl (Barbell)|Biceps|Barbell|wr|Hold a barbell with both hands, palms up and a few inches apart. Stand with your torso straight and your head up. Your feet should be about shoulder width and your elbows close to your torso.\nCocoons|Abs|Bodyweight|bw|Begin by lying on your back on the ground. Your legs should be straight and your arms extended behind your head. To perform the movement, tuck the knees toward your chest, rotating your pelvis to lift your glutes from the floor.\nConan\'s Wheel|Quads|Other|bw|With the weight loaded, take a zurcher hold on the end of the implement. Place the bar in the crook of the elbow and hold onto your wrist. Try to keep the weight off of the forearms. Begin by lifting the weight from the ground.\nCross Body Hammer Curl (Dumbbell)|Biceps|Dumbbell|wr|Stand up straight with a dumbbell in each hand. Your hands should be down at your side with your palms facing in. While keeping your palms facing in and without twisting your arm, curl the dumbbell of the right arm up towards your left shoulder as you exhale.\nCross over (Band)|Chest|Band|bw|Secure an exercise band around a stationary post. While facing away from the post, grab the handles on both ends of the band and step forward enough to create tension on the band.\nCross-Body Crunch|Abs|Bodyweight|bw|Lie flat on your back and bend your knees about 60 degrees. Keep your feet flat on the floor and place your hands loosely behind your head.\nCrucifix|Shoulders|Other|bw|In the crucifix, you statically hold weights out to the side for time. While the event can be practiced using dumbbells, it is best to practice with one of the various implements used, such as axes and hammers, as it feels different.\nCrunch - Hands Overhead|Abs|Bodyweight|bw|Lie on the floor with your back flat and knees bent with around a 60-degree angle between the hamstrings and the calves. Keep your feet flat on the floor and stretch your arms overhead with your palms crossed.\nCrunch - Legs on Exercise Ball|Abs|Bodyweight|bw|Lie flat on your back with your feet resting on an exercise ball and your knees bent at a 90 degree angle. Place your feet three to four inches apart and point your toes inward so they touch.\nCuban Press (Dumbbell)|Shoulders|Dumbbell|wr|Take a dumbbell in each hand with a pronated grip in a standing position. Raise your upper arms so that they are parallel to the floor, allowing your lower arms to hang in the "scarecrow" position.\nDead Bug|Abs|Bodyweight|bw|Begin lying on your back with your hands extended above you toward the ceiling. Bring your feet, knees, and hips up to 90 degrees. Exhale hard to bring your ribcage down and flatten your back onto the floor, rotating your pelvis up and squeezing your glutes.\nDeadlift with Bands (Barbell)|Back|Barbell|wr|To deadlift with short bands, simply loop them over the bar before you start, and step into them to set up. For long bands, they will need to be anchored to a secure base, such as heavy dumbbells or a rack.\nDeadlift with Chains (Barbell)|Back|Barbell|wr|You can attach the chains to the sleeves of the bar, or just drape the middle over the bar so there is a greater weight increase as you lift. Approach the bar so that it is centered over your feet. You feet should be about hip width apart.\nDecline Close-Grip Bench to Skull Crusher (Barbell)|Triceps|Barbell|wr|Secure your legs at the end of the decline bench and slowly lay down on the bench. Using a close grip (a grip that is slightly less than shoulder width), lift the bar from the rack and hold it straight over you with your arms locked and elbows in.\nDecline Crunch|Abs|Bodyweight|bw|Secure your legs at the end of the decline bench and lie down. Now place your hands lightly on either side of your head keeping your elbows in. Tip: Don\'t lock your fingers behind your head.\nDecline Fly (Dumbbell)|Chest|Dumbbell|wr|Secure your legs at the end of the decline bench and lie down with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other. Once you are laying down, move the dumbbells in front of you at shoulder width.\nDecline Triceps Extension (Dumbbell)|Triceps|Dumbbell|wr|Secure your legs at the end of the decline bench and lie down with a dumbbell on each hand on top of your thighs. The palms of your hand will be facing each other. Once you are laying down, move the dumbbells in front of you at shoulder width.\nDecline Ez Bar Triceps Extension (Barbell)|Triceps|Barbell|wr|Secure your legs at the end of the decline bench and slowly lay down on the bench. Using a close grip (a grip that is slightly less than shoulder width), lift the EZ bar from the rack and hold it straight over you with your arms locked and elbows in.\nDecline Oblique Crunch|Abs|Bodyweight|bw|Secure your legs at the end of the decline bench and slowly lay down on the bench. Raise your upper body off the bench until your torso is about 35-45 degrees if measured from the floor. Put one hand beside your head and the other on your thigh.\nDecline Push Up|Chest|Other|bw|Lie on the floor face down and place your hands about 36 inches apart while holding your torso up at arms length. Move your feet up to a box or bench. Next, lower yourself downward until your chest almost touches the floor as you inhale.\nDecline Reverse Crunch|Abs|Bodyweight|bw|Lie on your back on a decline bench and hold on to the top of the bench with both hands. Don\'t let your body slip down from this position. Hold your legs parallel to the floor using your abs to hold them there while keeping your knees and feet together.\nDecline Press (Smith Machine)|Chest|Smith Machine|wr|Place a decline bench underneath the Smith machine. Now place the barbell at a height that you can reach when lying down and your arms are almost fully extended.\nDeficit Deadlift (Barbell)|Back|Barbell|wr|Begin by having a platform or weight plates that you can stand on, usually 1-3 inches in height. Approach the bar so that it is centered over your feet. You feet should be about hip width apart.\nDepth Jump Leap|Quads|Other|bw|For this drill you will need two boxes or benches, one 12 to 16 inches high and the other 22 to 26 inches high. Stand on one of the two boxes with arms at the sides; feet should be together and slightly off the edge as in the depth jump.\nDip (Machine)|Triceps|Machine|wr|Sit securely in a dip machine, select the weight and firmly grasp the handles. Now keep your elbows in at your sides in order to place emphasis on the triceps. The elbows should be bent at a 90 degree angle.\nDip - Chest Version|Chest|Other|bw|For this exercise you will need access to parallel bars. While breathing in, lower yourself slowly with your torso leaning forward around 30 degrees or so and your elbows flared out slightly until you feel a slight stretch in the chest.\nDip - Triceps Version|Triceps|Bodyweight|bw|Now, inhale and slowly lower yourself downward. Your torso should remain upright and your elbows should stay close to your body. This helps to better focus on tricep involvement.\nDonkey Calf Raise|Calves|Other|bw|For this exercise you will need access to a donkey calf raise machine. Start by positioning your lower back and hips under the padded lever provided. The tailbone area should be the one making contact with the pad.\nDouble Alternating Hang Clean (Kettlebell)|Hamstrings|Kettlebell|wr|Place two kettlebells between your feet. Clean one kettlebell to your shoulder and hold on to the other kettlebell. With a fluid motion, lower the top kettlebell while driving the bottom kettlebell up.\nDouble Jerk (Kettlebell)|Shoulders|Kettlebell|wr|Hold a kettlebell by the handle in each hand. Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so, so that the palms face forward.\nDouble Push Press (Kettlebell)|Shoulders|Kettlebell|wr|Clean two kettlebells to your shoulders. Squat down a few inches and reverse the motion rapidly. Use the momentum from the legs to drive the kettlebells overhead. Once the kettlebells are locked out, lower the kettlebells to your shoulders and repeat.\nDouble Snatch (Kettlebell)|Shoulders|Kettlebell|wr|Place two kettlebells behind your feet. Bend your knees and sit back to pick up the kettlebells. Swing the kettlebells between your legs forcefully and reverse the direction.\nDouble Windmill (Kettlebell)|Abs|Kettlebell|wr|Place a kettlebell in front of your front foot and clean and press a kettlebell overhead with your opposite arm. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulders.\nDouble Leg Butt Kick|Quads|Bodyweight|bw|Begin standing with your knees slightly bent. Quickly squat a short distance, flexing the hips and knees, and immediately extend to jump for maximum vertical height. As you go up, tuck your heels by flexing the knees, attempting to touch the buttocks.\nDownward Facing Balance (Swiss Ball)|Glutes|Swiss Ball|bw|Lie facedown on top of an exercise ball. While resting on your stomach on the ball, walk your hands forward along the floor and lift your legs, extending your elbows and knees.\nDrag Curl (Barbell)|Biceps|Barbell|wr|Grab a barbell with a supinated grip (palms facing forward) and get your elbows close to your torso and back. As you exhale, curl the bar up while keeping the elbows to the back as you "Drag" the bar up by keeping it in contact with your torso.\nDrop Push|Chest|Other|bw|Position low boxes or other platforms 2-3 feet apart. Move to a pushup position between them, supporting yourself by placing your hands on the boxes.\nAlternate Bicep Curl (Dumbbell)|Biceps|Dumbbell|wr|Stand (torso upright) with a dumbbell in each hand held at arms length. The elbows should be close to the torso and the palms of your hand should be facing your thighs.\nBench Press with Neutral Grip (Dumbbell)|Chest|Dumbbell|wr|Take a dumbbell in each hand and lay back onto a flat bench. Your feet should be flat on the floor and your shoulder blades retracted.\nClean (Dumbbell)|Hamstrings|Dumbbell|wr|Begin standing with a dumbbell in each hand with your feet shoulder width apart. Lower the weights to the floor by flexing at the hips and knees, pushing your hips back until the dumbbells reach the floor.\nFloor Press (Dumbbell)|Triceps|Dumbbell|wr|Lay on the floor holding dumbbells in your hands. Your knees can be bent. Begin with the weights fully extended above you. Lower the weights until your upper arm comes in contact with the floor.\nFly (Dumbbell)|Chest|Dumbbell|wr|Lie down on a flat bench with a dumbbell on each hand resting on top of your thighs. The palms of your hand will be facing each other.\nIncline Row (Dumbbell)|Back|Dumbbell|wr|Using a neutral grip, lean into an incline bench. Take a dumbbell in each hand with a neutral grip, beginning with the arms straight. Retract the shoulder blades and flex the elbows to row the dumbbells to your side.\nIncline Shoulder Raise (Dumbbell)|Shoulders|Dumbbell|wr|Sit on an Incline Bench while holding a dumbbell on each hand on top of your thighs. Lift your legs up to kick the weights to your shoulders and lean back. Position the dumbbells above your shoulders with your arms extended.\nLying Single Arm Rear Lateral Raise (Dumbbell)|Shoulders|Dumbbell|wr|While holding a dumbbell in one hand, lay with your chest down on a slightly inclined (around 15 degrees when measured from the floor) adjustable bench. The other hand can be used to hold to the leg of the bench for stability.\nLying Pronation (Dumbbell)|Forearms|Dumbbell|wr|Lie on a flat bench face down with one arm holding a dumbbell and the other hand on top of the bench folded so that you can rest your head on it.\nLying Rear Lateral Raise (Dumbbell)|Shoulders|Dumbbell|wr|While holding a dumbbell in each hand, lay with your chest down on a slightly inclined (around 15 degrees when measured from the floor) adjustable bench.\nLying Supination (Dumbbell)|Forearms|Dumbbell|wr|Lie sideways on a flat bench with one arm holding a dumbbell and the other hand on top of the bench folded so that you can rest your head on it.\nSingle Arm Shoulder Press (Dumbbell)|Shoulders|Dumbbell|wr|Grab a dumbbell and either sit on a military press bench or a utility bench that has a back support on it as you place the dumbbells upright on top of your thighs or stand up straight. Clean the dumbbell up to bring it to shoulder height.\nSingle Arm Upright Row (Dumbbell)|Shoulders|Dumbbell|wr|Grab a dumbbell and stand up straight with your arm extended in front of you with a slight bend at the elbows and your back straight. Tip: The dumbbell should be resting on top of your thigh with the palm of your hands facing your thighs.\nProne Incline Curl (Dumbbell)|Biceps|Dumbbell|wr|Grab a dumbbell on each hand and lie face down on an incline bench with your shoulders near top of the incline. Your knees can rest on the seat or your legs can be straddled to the sides (my preferred way).\nRaise (Dumbbell)|Shoulders|Dumbbell|wr|Grab a dumbbell in each arm and stand up straight with your arms extended by your sides with a slight bend at the elbows and your back straight. Tip: The dumbbell should be next to your thighs with the palm of your hands facing back.\nRear Lunge (Dumbbell)|Quads|Dumbbell|wr|Stand with your torso upright holding two dumbbells in your hands by your sides. Step backward with your right leg around two feet or so from the left foot and lower your upper body down, while keeping the torso upright and maintaining balance.\nScaption (Dumbbell)|Shoulders|Dumbbell|wr|This corrective exercise strengthens the muscles that stabilize your shoulder blade. Hold a light weight in each hand, hanging at your sides. Your thumbs should pointing up. Begin the movement raising your arms out in front of you, about 30 degrees off center.\nSeated Box Jump (Dumbbell)|Quads|Dumbbell|wr|Position a box a couple feet to the side of a bench. Hold a dumbbell to your chest with both hands and seat yourself on the bench facing the box.\nSeated Single Leg Calf Raise (Dumbbell)|Calves|Dumbbell|wr|Place a block on the floor about 12 inches from a flat bench. Sit on a flat bench and place a dumbbell on your upper left thigh about 3 inches above your knee. Now place the ball of your left foot on the block.\nSide Bend (Dumbbell)|Abs|Dumbbell|wr|Stand up straight while holding a dumbbell on the left hand (palms facing the torso) as you have the right hand holding your waist. Your feet should be placed at shoulder width.\nSquat (Dumbbell)|Quads|Dumbbell|wr|Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs). Position your legs using a shoulder width medium stance with the toes slightly pointed out.\nSquat to a Bench (Dumbbell)|Quads|Dumbbell|wr|Stand up straight with a flat bench behind you while holding a dumbbell on each hand (palms facing the side of your legs). Position your legs using a shoulder width medium stance with the toes slightly pointed out.\nStep Ups (Dumbbell)|Quads|Dumbbell|wr|Stand up straight while holding a dumbbell on each hand (palms facing the side of your legs). Place the right foot on the elevated platform. Step on the platform by extending the hip and the knee of your right leg.\nTricep Extension - Pronated Grip (Dumbbell)|Triceps|Dumbbell|wr|Lie down on a flat bench holding two dumbbells directly above your shoulders. Your arms should be fully extended and form a 90 degree angle from your torso and the floor. The palms of your hands should be facing forward, and your elbows should be tucked in.\nCurl (EZ Bar)|Biceps|EZ Bar|wr|Stand up straight while holding an EZ curl bar at the wide outer handle. The palms of your hands should be facing forward and slightly tilted inward due to the shape of the bar. Keep your elbows close to your torso.\nSkullcrusher (EZ Bar)|Triceps|EZ Bar|wr|Using a close grip, lift the EZ bar and hold it with your elbows in as you lie on the bench. Your arms should be perpendicular to the floor. Keeping the upper arms stationary, lower the bar by allowing the elbows to flex.\nElbow to Knee|Abs|Bodyweight|bw|Lie on the floor, crossing your right leg across your bent left knee. Clasp your hands behind your head, beginning with your shoulder blades on the ground.\nElevated Back Lunge (Barbell)|Quads|Barbell|wr|Position a bar onto a rack at shoulder height loaded to an appropriate weight. Place a short, raised platform behind you. Rack the bar onto your upper back, keeping your back arched and tight. Step onto your raised platform with both feet.\nElevated Row (Cable)|Back|Cable|wr|Get a platform of some sort (it can be an aerobics or calf raise platform) that is around 4-6 inches in height. Place it on the seat of the cable row machine.\nExtended Range Single Arm Floor Press (Kettlebell)|Chest|Kettlebell|wr|Lie on the floor and position a kettlebell for one arm to press. The kettlebell should be held by the handle. The leg on the same side that you are pressing should be bent, with the knee crossing over the midline of the body.\nExternal Rotation (Dumbbell)|Shoulders|Dumbbell|wr|Lie sideways on a flat bench with one arm holding a dumbbell and the other hand on top of the bench folded so that you can rest your head on it.\nExternal Rotation (Band)|Shoulders|Band|bw|Choke the band around a post. The band should be at the same height as your elbow. Stand with your left side to the band a couple of feet away. Grasp the end of the band with your right hand, and keep your elbow pressed firmly to your side.\nExternal Rotation (Cable)|Shoulders|Cable|wr|Adjust the cable to the same height as your elbow. Stand with your left side to the band a couple of feet away. Grasp the handle with your right hand, and keep your elbow pressed firmly to your side.\nFarmer\'s Walk|Forearms|Other|dur|There are various implements that can be used for the farmers walk. These can also be performed with heavy dumbbells or short bars if these implements aren\'t available. Begin by standing between the implements.\nFast Skipping|Quads|Bodyweight|bw|Start in a relaxed position with one leg slightly forward. Skip by executing a step-hop pattern of right-right-step to left-left-step, and so on, alternating back and forth.\nFinger Curl (Barbell)|Forearms|Barbell|wr|Hold a barbell with both hands and your palms facing up; hands spaced about shoulder width. Place your feet flat on the floor, at a distance that is slightly wider than shoulder width apart. Lower the bar as far as possible by extending the fingers.\nFlat Bench Fly (Cable)|Chest|Cable|wr|Position a flat bench between two low pulleys so that when you are laying on it, your chest will be lined up with the cable pulleys. Lay flat on the bench and keep your feet on the ground. Have someone hand you the handles on each hand.\nFlat Bench Leg Pull-In|Abs|Bodyweight|bw|Lie on an exercise mat or a flat bench with your legs off the end. Place your hands either under your glutes with your palms down or by the sides holding on to the bench (or with palms down by the side on an exercise mat). Also extend your legs straight out.\nFlat Bench Lying Leg Raise|Abs|Bodyweight|bw|Lie with your back flat on a bench and your legs extended in front of you off the end. Place your hands either under your glutes with your palms down or by the sides holding on to the bench.\nFlexor Incline Curl (Dumbbell)|Biceps|Dumbbell|wr|Hold the dumbbell towards the side farther from you so that you have more weight on the side closest to you. (This can be done for a good effect on all bicep dumbbell exercises).\nFloor Glute-Ham Raise|Hamstrings|Other|bw|You can use a partner for this exercise or brace your feet under something stable. Begin on your knees with your upper legs and torso upright. If using a partner, they will firmly hold your feet to keep you in position.\nFloor Press (Barbell)|Triceps|Barbell|wr|Adjust the j-hooks so they are at the appropriate height to rack the bar. Begin lying on the floor with your head near the end of a power rack. Keeping your shoulder blades pulled together; pull the bar off of the hooks.\nFloor Press with Chains (Barbell)|Triceps|Barbell|wr|Adjust the j-hooks so they are at the appropriate height to rack the bar. For this exercise, drape the chains directly over the end of the bar, trying to keep the ends away from the plates. Begin lying on the floor with your head near the end of a power rack.\nFlutter Kicks|Glutes|Bodyweight|bw|On a flat bench lie facedown with the hips on the edge of the bench, the legs straight with toes high off the floor and with the arms on top of the bench holding on to the front edge.\nForward Drag with Press|Chest|Other|dur|Attach a dual handled chain or rope attachment to the sled. You should be facing away from the sled, holding a handle in each hand. Begin the movement by moving forward for one step.\nFrankenstein Squat (Barbell)|Quads|Barbell|wr|This drill teaches you the proper positioning of both the bar and your body during the clean and front squat. Place the barbell on the front of the shoulders, releasing your grip and extending your arms out in front of you.\nFreehand Jump Squat|Quads|Bodyweight|bw|Cross your arms over your chest. With your head up and your back straight, position your feet at shoulder width. Keeping your back straight and chest up, squat down as you inhale until your upper thighs are parallel, or lower, to the floor.\nFrog Sit Up|Abs|Bodyweight|bw|Lie with your back flat on the floor (or exercise mat) and your legs extended in front of you. Now bend at the knees and place your outer thighs by the floor (or mat) as you make the soles of your feet touch each other.\nFront Squat to a Bench (Barbell)|Quads|Barbell|wr|This exercise is best performed inside a squat rack for safety purposes. To begin, first set a flat bench behind you and set the bar on a rack that best matches your height.\nFront Box Jump|Hamstrings|Other|bw|Begin with a box of an appropriate height 1-2 feet in front of you. Stand with your feet should width apart. Perform a short squat in preparation for jumping, swinging your arms behind you.\nFront Raise (Cable)|Shoulders|Cable|wr|Select the weight on a low pulley machine and grasp the single hand cable attachment that is attached to the low pulley with your left hand.\nFront Cone Hops (or Hurdle Hops)|Quads|Other|bw|Set up a row of cones or other small barriers, placing them a few feet apart. Stand in front of the first cone with your feet shoulder width apart. Begin by jumping with both feet over the first cone, swinging both arms as you jump.\nFront Incline Raise (Dumbbell)|Shoulders|Dumbbell|wr|Sit down on an incline bench with the incline set anywhere between 30 to 60 degrees while holding a dumbbell on each hand. Tip: You can change the angle to hit the muscle a little differently each time.\nFront Plate Raise|Shoulders|Other|bw|While standing straight, hold a barbell plate in both hands at the 3 and 9 o\'clock positions.\nFront Raise and Pullover (Barbell)|Chest|Barbell|wr|Lie on a flat bench while holding a barbell using a palms down grip that is about 15 inches apart. Place the bar on your upper thighs, extend your arms and lock them while keeping a slight bend on the elbows.\nFront Squat (Clean Grip) (Barbell)|Quads|Barbell|wr|To begin, first set the bar in a rack slightly below shoulder level. Rest the bar on top of the deltoids, pushing into the clavicles, and lightly touching the throat.\nFront Squat with Two (Kettlebell)|Quads|Kettlebell|wr|Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so.\nFront Two - Raise (Dumbbell)|Shoulders|Dumbbell|wr|Pick a couple of dumbbells and stand with a straight torso and the dumbbells on front of your thighs at arms length with the palms of the hand facing your thighs.\nFull Range-Of-Motion Lat Pulldown (Cable)|Back|Cable|wr|Either standing or seated on a high bench, grasp two stirrup cables that are attached to the high pulleys. Grab with the opposing hand so your arms are crisscrossed about you and your palms are facing forward.\nGironda Sternum Chins|Back|Other|bw|Grasp the pull-up bar with a shoulder width underhand grip. Now hang with your arms fully extended and stick your chest out and lean back. Tip: You will be leaning back throughout the entire movement.\nGlute Ham Raise (Machine)|Hamstrings|Machine|wr|Begin by adjusting the equipment to fit your body. Place your feet against the footplate in between the rollers as you lie facedown. Your knees should be just behind the pad. Start from the bottom of the movement.\nGlute Kickback|Glutes|Bodyweight|bw|Kneel on the floor or an exercise mat and bend at the waist with your arms extended in front of you (perpendicular to the torso) in order to get into a kneeling push-up position but with the arms spaced at shoulder width.\nGood Morning off Pins (Barbell)|Hamstrings|Barbell|wr|Begin with a bar on a rack at about the same height as your stomach. Bend over underneath the bar and rack the bar across the rear of your shoulders as you would a power squat, not on ht as your stomach. Suspend the bar using chains or suspension straps. Bend over underneath the bar and rack the bar across the rear of your shoulders as you would a power squat, not on top of your traps.\nHanging Pike|Abs|Bodyweight|bw|Hang from a chin-up bar with your legs and feet together using an overhand grip (palms facing away from you) that is slightly wider than shoulder width. Tip: You may use wrist wraps in order to facilitate holding on to the bar.\nHeaving Snatch Balance (Barbell)|Quads|Barbell|wr|This drill helps you learn the snatch. Begin by holding a light weight across the back of the shoulders. Your feet should be slightly wider than hip width apart with the feet turned out, the same position that you would perform a squat with.\nHeavy Bag Thrust|Chest|Other|bw|Utilize a heavy bag for this exercise. Assume an upright stance next to the bag, with your feet staggered, fairly wide apart. Place your hand on the bag at about chest height. Begin by twisting at the waist, pushing the bag forward as hard as possible.\nHigh Curl (Cable)|Biceps|Cable|wr|Stand between a couple of high pulleys and grab a handle in each arm. Position your upper arms in a way that they are parallel to the floor with the palms of your hands facing you. Curl the handles towards you until they are next to your ears.\nHip Extension (Band)|Glutes|Band|bw|Secure one end of the band to the lower portion of a post and attach the other to one ankle. Facing the attachment point of the band, hold on to the column to stabilize yourself.\nHip Flexion (Band)|Quads|Band|bw|Secure one end of the band to the lower portion of a post and attach the other to one ankle. Face away from the attachment point of the band. Keeping your head and your chest up, raise your knee up to 90 degrees and pause.\nHip Lift (Band)|Glutes|Band|bw|After choosing a suitable band, lay down in the middle of the rack, after securing the band on either side of you. If your rack doesn\'t have pegs, the band can be secured ngth. Keep your elbows close to your torso and rotate the palms of your hands until they are facing forward.\nIncline Fly (Dumbbell)|Chest|Dumbbell|wr|Hold a dumbbell on each hand and lie on an incline bench that is set to an incline angle of no more than 30 degrees. Extend your arms above you with a slight bend at the elbows. Now rotate the wrists so that the palms of your hands are facing you.\nIncline Fly - with a Twist (Dumbbell)|Chest|Dumbbell|wr|Hold a dumbbell in each hand and lie on an incline bench that is set to an incline angle of no more than 30 degrees. Extend your arms above you with a slight bend at the elbows. Now rotate the wrists so that the palms of your hands are facing you.\nIncline Press (Dumbbell)|Chest|Dumbbell|wr|Lie back on an incline bench with a dumbbell in each hand atop your thighs. The palms of your hands will be facing each other. Then, using your thighs to help push the dumbbells up, lift the dumbbells one at a time so that you can hold them at shoulder width.\nIncline Hammer Curl (Dumbbell)|Biceps|Dumbbell|wr|Seat yourself on an incline bench with a dumbbell in each hand. You should pressed firmly against he back with your feet together. Allow the dumbbells to hang straight down at your side, holding them with a neutral grip.\nIncline Inner Biceps Curl (Dumbbell)|Biceps|Dumbbell|wr|Hold a dumbbell in each hand and lie back on an incline bench. The dumbbells should be at arm\'s length hanging at your sides and your palms should be facing out.\nIncline Push Up|Chest|Bodyweight|bw|Stand facing bench or sturdy elevated platform. Place hands on edge of bench or platform, slightly wider than shoulder width. Position forefoot back from bench or platform with arms and body straight. Arms should be perpendicular to body.\nIncline Push Up Close-Grip|Triceps|Bodyweight|bw|Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height. Place your hands next to one another on the bar. Position your feet back from the bar with arms and body straight.\nIncline Push Up Depth Jump|Chest|Other|bw|For this drill you will need a box about 12 inches high, and two thick mats or aerobics steps. Place the steps just outside of your shoulders, and place your feet on top of the box so that you are in an incline pushup position, your hands just inside the steps.\nIncline Push Up Medium|Chest|Bodyweight|bw|Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height. Place your hands on the bar, with your hands about shoulder width apart. Position your feet back from the bar with arms and body straight.\nIncline Push Up Reverse Grip|Chest|Bodyweight|bw|Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height. Place your hands on the bar palms up, with your hands about shoulder width apart. Position your feet back from the bar with arms and body straight.\nIncline Push Up Wide|Chest|Bodyweight|bw|Stand facing a Smith machine bar or sturdy elevated platform at an appropriate height. Place your hands on the bar, with your hands wider than shoulder width. Position your feet back from the bar with arms and body straight.\nInternal Rotation (Band)|Shoulders|Band|bw|Choke the band around a post. The band should be at the same height as your elbow. Stand with your right side to the band a couple of feet away. Grasp the end of the band with your right hand, and keep your elbow pressed firmly to your side.\nInverted Row with Straps|Back|Other|wr|Hang a rope or suspension straps from a rack or other stable object. Grasp the ends and position yourself in a supine position hanging from the ropes. Your body should be straight with your heels on the ground with your arms fully extended.\nIron Cross (Dumbbell)|Shoulders|Dumbbell|wr|\nIsometric Chest Squeezes|Chest|Bodyweight|dur|While either seating or standing, bend your arms at a 90-degree angle and place the palms of your hands together in front of your chest. Tip: Your hands should be open with the palms together and fingers facing forward (perpendicular to your torso).\nIsometric Neck Exercise - Front and Back|Neck|Bodyweight|dur|With your head and neck in a neutral position (normal position with head erect facing forward), place both of your hands on the front side of your head. Now gently push forward as you contract the neck muscles but resisting any movement of your head.\nIsometric Neck Exercise - Sides|Neck|Bodyweight|dur|With your head and neck in a neutral position (normal position with head erect facing forward), place your left hand on the left side of your head. Now gently push towards the left as you contract the left neck muscles but resisting any movement of your head.\nIsometric Wipers|Chest|Bodyweight|dur|Assume a push-up position, supporting your weight on your hands and toes while keeping your body straight. Your hands should be just outside of shoulder width.\nJm Press (Barbell)|Triceps|Barbell|wr|Start the exercise the same way you would a close grip bench press. You will lie on a flat bench while holding a barbell at arms length (fully extended) with the elbows in.\nJanda Sit Up|Abs|Bodyweight|bw|Position your body on the floor in the basic sit-up position; knees to a ninety degree angle with feet flat on the floor and arms either crossed over your chest or to the sides.\nJefferson Squat (Barbell)|Quads|Barbell|wr|Place a barbell on the floor. Stand in the middle of the bar length wise. Bend down by bending at the knees and keeping your back straight and grasp the front of the bar with your right hand. Your palm should be in (neutral grip) facing the left side.\nJerk Balance (Barbell)|Shoulders|Barbell|wr|This drill helps you learn to drive yourself low enough during the jerk and corrects those who move backward during the movement. Begin with the bar racked in the jerk position, with the shoulders forward, torso upright, and the feet split slightly apart.\nJerk Dip Squat (Barbell)|Quads|Barbell|wr|This movement strengthens the dip portion of the jerk. Begin with the bar racked in the jerk position, with the shoulders forward to create a shelf and the bar lightly contacting the throat.\nJogging, Treadmill (Machine)|Cardio|Machine|cd|To begin, step onto the treadmill and select the desired option from the menu. Most treadmills have a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise.\nKeg Load|Back|Other|bw|To load kegs, place the desired number a distance from the loading platform, typically 30-50 feet. Begin by grabbing the close handle of the first keg, tilting it onto its side to grab the opposite edge of the bottom of the keg. Lift the keg up to your chest.\nArnold Press (Kettlebell)|Shoulders|Kettlebell|wr|Clean a kettlebell to your shoulder. Clean the kettlebell to your shoulder by extending through the legs and hips as you raise the kettlebell towards your shoulder. The palm should be facing inward.\nDead Clean (Kettlebell)|Hamstrings|Kettlebell|wr|Place kettlebell between your feet. Clean the kettlebell to your shoulder. Clean the kettlebell to your shoulders by extending through the legs and hips as you raise the kettlebell towards your shoulder. The wrist should rotate as you do so.\nFigure 8 (Kettlebell)|Abs|Kettlebell|wr|Place one kettlebell between your legs and take a wider than shoulder width stance. Bend over by pushing your butt out and keeping your back flat. Pick up a kettlebell and pass it to your other hand between your legs.\nHalo (Kettlebell)|Shoulders|Kettlebell|wr|Stand tall with your feet hip-width apart. Hold a kettlebell upside down by the horns, with the bell above your hands and close to your chest. Brace your abdominals and squeeze your glutes so your ribcage stays down.\nHalo with Overhead Extension (Kettlebell)|Shoulders|Kettlebell|wr|Stand tall with your feet hip-width apart. Hold a kettlebell upside down by the horns, with the bell above your hands and close to your chest. Brace your abdominals and squeeze your glutes so your ribcage stays down.\nHang Clean (Kettlebell)|Hamstrings|Kettlebell|wr|Place kettlebell between your feet. Clean kettlebell to your shoulder. Clean the kettlebell to your shoulders by extending through the legs and hips as you raise the kettlebell towards your shoulder. The wrist should rotate as you do so.\nSingle Legged Deadlift (Kettlebell)|Hamstrings|Kettlebell|wr|Hold a kettlebell by the handle in one hand. Stand on one leg, on the same side that you hold the kettlebell. Keeping that knee slightly bent, perform a stiff legged deadlift by bending at the hip, extending your free leg behind you for balance.\nOverhead Triceps Extension (Kettlebell)|Triceps|Kettlebell|wr|Stand with your feet hip-width apart, holding a kettlebell by the horns with both hands. Press it overhead until your arms are extended, with the bell hanging behind your hands. Brace your abdominals and keep your upper arms vertical and close to your head.\nPass Between the Legs (Kettlebell)|Abs|Kettlebell|wr|Place one kettlebell between your legs and take a comfortable stance. Bend over by pushing your butt out and keeping your back flat. Pick up a kettlebell and pass it to your other hand between your legs, in the fashion of a "W".\nPirate Ships (Kettlebell)|Shoulders|Kettlebell|wr|With a wide stance, hold a kettlebell with both hands. Allow it to hang at waist level with your arms extended. Initiate the movement by turning to one side, swinging the kettlebell to head height. Briefly pause at the top of the motion.\nPistol Squat (Kettlebell)|Quads|Kettlebell|wr|Pick up a kettlebell with two hands and hold it by the horns. Hold one leg off of the floor and squat down on the other. Squat down by flexing the knee and sitting back with the hips, holding the kettlebell up in front of you.\nSeated Press (Kettlebell)|Shoulders|Kettlebell|wr|Sit on the floor and spread your legs out comfortably. Clean one kettlebell to your shoulder. Press the kettlebell up and out until it is locked out overhead.\nSeesaw Press (Kettlebell)|Shoulders|Kettlebell|wr|Clean two kettlebells two your shoulders. Press one kettlebell. Lower the kettlebell and immediately press the other kettlebell. Make sure to do the same amount of reps on both sides.\nSumo High Pull (Kettlebell)|Traps|Kettlebell|wr|Place a kettlebell on the ground between your feet. Position your feet in a wide stance, and grasp the kettlebell with two hands. Set your hips back as far as possible, with your knees bent. Keep your chest and head up.\nThruster (Kettlebell)|Shoulders|Kettlebell|wr|Clean two kettlebells to your shoulders. Clean the kettlebells to your shoulders by extending through the legs and hips as you pull the kettlebells towards your shoulders. Rotate your wrists as you do so.\nTurkish Get-Up (Lunge Style) (Kettlebell)|Shoulders|Kettlebell|wr|Lie on your back on the floor and press a kettlebell to the top position by extending the elbow. Bend the knee on the same side as the kettlebell.\nTurkish Get-Up (Squat Style) (Kettlebell)|Shoulders|Kettlebell|wr|Lie on your back on the floor and press a kettlebell to the top position by extending the elbow. Bend the knee on the same side as the kettlebell.\nWindmill (Kettlebell)|Abs|Kettlebell|wr|Place a kettlebell in front of your lead foot and clean and press it overhead with your opposite arm. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulders.\nKipping Muscle Up|Back|Other|bw|Grip the rings using a false grip, with the base of your palms on top of the rings. Begin with a movement swinging your legs backward slightly.\nKnee Tuck Jump|Hamstrings|Bodyweight|bw|Begin in a comfortable standing position with your knees slightly bent. Hold your hands in front of you, palms down with your fingertips together at chest height. Rapidly dip down into a quarter squat and immediately explode upward.\nKnee/Hip Raise on Parallel Bars|Abs|Other| ur head and keep your chest up.\nLinear 3-Part Start Technique|Hamstrings|Other|bw|This drill helps you accelerate as quickly as possible into a sprint from a dead stop. It helps to use a line to start from. Begin with two feet on the line. Place your left foot with the toe next to your right ankle.\nLinear Acceleration Wall Drill|Hamstrings|Other|bw|Lean at around 45 degrees against a wall. Your feet should be together, glutes contracted. Begin by lifting your right knee quickly, pausing, and then driving it straight down into the ground.\nLinear Depth Jump|Quads|Other|bw|You will need two boxes or benches spaced a few feet away from each other. Begin by standing on one box facing towards the other platform. To initiate the movement, gently drop down to the ground between your platforms, allowing the knees and hips to flex.\nLog Lift|Shoulders|Other|bw|Begin standing with the log in front of you. Grasp the handles, and begin to clean the log. As you are bent over to start the clean, attempt to get the log as high as possible, pulling it into your chest.\nLondon Bridges|Back|Other|bw|Attach a climbing rope to a high beam or cross member. Below it, ensure that the smith machine bar is locked in place with the safeties and cannot move. Alternatively, a secure box could also be utilized. Stand on the bar, using the rope to balance yourself.\nLow Crossover (Cable)|Chest|Cable|wr|Step forward, gaining tension in the pulleys. Your palms should be facing forward, hands below the waist, and your arms straight. With a slight bend in your arms, draw your hands upward and toward the midline of your body.\nLow Triceps Extension (Cable)|Triceps|Cable|wr|Select the desired weight and lay down face up on the bench of a seated row machine that has a rope attached to it. Your head should be pointing towards the attachment. Grab the outside of the rope ends with your palms facing each other (neutral grip).\nLow Row to Neck (Cable)|Shoulders|Cable|wr|Sit on a low pulley row machine wi ard.\nSingle Arm Para Press (Kettlebell)|Shoulders|Kettlebell|wr|Clean a kettlebell to your shoulder. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces forward.\nSingle Arm Push Press (Kettlebell)|Shoulders|Kettlebell|wr|Hold a kettlebell by the handle. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces forward.\nSingle Arm Row (Kettlebell)|Back|Kettlebell|wr|Place a kettlebell in front of your feet. Grab the kettlebell and pull it to your stomach, retracting your shoulder blade and flexing the elbow. Keep your back straight. Lower and repeat.\nSingle Arm Snatch (Kettlebell)|Shoulders|Kettlebell|wr|Place a kettlebell between your feet. Look straight ahead and swing the kettlebell back between your legs. Immediately reverse the direction and drive through with your hips and knees, accelerating the kettlebell upward.\nSingle Arm Split Jerk (Kettlebell)|Shoulders|Kettlebell|wr|Hold a kettlebell by the handle. Clean the kettlebell to your shoulder by extending through the legs and hips as you pull the kettlebell towards your shoulder. Rotate your wrist as you do so, so that the palm faces forward.\nSingle Arm Split Snatch (Kettlebell)|Shoulders|Kettlebell|wr|Hold a kettlebell in one hand by the handle. Squat towards the floor, and then reverse the motion, extending the hips, knees, and finally the ankles, to raise the kettlebell overhead.\nSingle Arm Swing (Kettlebell)|Hamstrings|Kettlebell|wr|\nSingle Arm Long Bar Row (Barbell)|Back|Barbell|wr|Position a bar into a landmine or in a corner to keep it from moving. Load an appropriate weight onto your end. Stand next to the bar, and take a grip with one hand close to the collar. Using your hips and legs, rise to a standing position.\nSingle Arm Slam (Medicine Ball he chest up and the head looking forward.\nPower Stairs|Hamstrings|Other|bw|In the power stairs, implements are moved up a staircase. For training purposes, these can be performed with a tire or box. Begin by taking the implement with both hands. Set your feet wide, with your head and chest up.\nPreacher Hammer Curl (Dumbbell)|Biceps|Dumbbell|wr|Place the upper part of both arms on top of the preacher bench as you hold a dumbbell in each hand with the palms facing each other (neutral grip). As you breathe in, slowly lower the dumbbells until your upper arm is extended and the biceps is fully stretched.\nPress Sit Up (Barbell)|Abs|Barbell|wr|To begin, lie down on a bench with a barbell resting on your chest. Position your legs so they are secure on the extension of the abdominal bench. While inhaling, tighten your abdominals and glutes.\nProne Manual Hamstring|Hamstrings|Other|bw|You will need a partner for this exercise. Lay face down with your legs straight. Your assistant will place their hand on your heel. To begin, flex the knee to curl your leg up.\nProwler Sprint|Cardio|Other|cd|Place your sled on an appropriate surface, loaded to a suitable weight. The sled should provide enough resistance to require effort, but not so heavy that you are significantly slowed down. You may use the upright or the low handles for this exercise.\nPull Through (Cable)|Glutes|Cable|wr|Begin standing a few feet in front of a low pulley with a rope or handle attached. Face away from the machine, straddling the cable, with your feet set wide apart. Begin the movement by reaching through your legs as far as possible, bending at the hips.\nPush Press (Barbell)|Shoulders|Barbell|wr|\nPush Press - Behind the Neck (Barbell)|Shoulders|Barbell|wr|Standing with the weight racked on the back of the shoulders, begin with the dip. With your feet directly under your hips, flex the knees without moving the hips backward. Go down only slightly, and reverse direction as powerfully as possible.\nPush ders. Begin holding a bar in the scarecrow position, with the upper arms parallel to the floor, and the forearms hanging down.\nRack Pull with Bands (Barbell)|Back|Barbell|wr|Set up in a power rack with the bar on the pins. The pins should be set to the desired point; just below the knees, just above, or in the mid thigh position. Attach bands to the base of the rack, or secure them with dumbbells. Attach the other end to the bar.\nRack Pull (Barbell)|Back|Barbell|wr|Set up in a power rack with the bar on the pins. The pins should be set to the desired point; just below the knees, just above, or in the mid thigh position. Position yourself against the bar in proper deadlifting position.\nRecumbent Bike (Machine)|Cardio|Machine|cd|To begin, seat yourself on the bike and adjust the seat to your height. Select the desired option from the menu. You may have to start pedaling to turn it on. You can use the manual setting, or you can select a program to use.\nReturn Push from Stance (Medicine Ball)|Shoulders|Medicine Ball|wr|You will need a partner for this drill. Begin in an athletic 2 or 3 point stance. At the signal, move into a position to receive the pass from your partner. Catch the medicine ball with both hands and immediately throw it back to your partner.\nReverse Band Bench Press (Barbell)|Triceps|Barbell|wr|Position a bench inside a power rack, with the bar set to the correct height. Begin by anchoring bands either to band pegs or to the top of the rack. Ensure that you will be position properly under the bands. Attach the other end to the barbell.\nReverse Band Box Squat (Barbell)|Quads|Barbell|wr|Begin in a power rack with a box at the appropriate height behind you. Set up the bands either on band pegs or attached to the top of the rack, ensuring they will be directly above the bar during the squat. Attach the other end to the bar.\nReverse Band Deadlift (Barbell)|Back|Barbell|wr|Set the bar up in a power rack. Attach bands to the top of the rack, using either bands pegs or the frame itself. Attach the other end of the bands to the bar. Approach the bar so that it is centered over your feet. You feet should be about hip width apart.\nReverse Band Power Squat (Barbell)|Quads|Barbell|wr|Begin in a power rack with the pins and bar set at the appropriate height. After loading the bar, attach bands to the top of the rack, using either pegs or the frame itself. Attach the other end of the bands to the bar.\nReverse Band Sumo Deadlift (Barbell)|Hamstrings|Barbell|wr|Begin with a bar loaded on the floor inside of a power rack. Attach bands to the top of the rack, using either pegs or the frame itself. Attach the other end to the barbell. Approach the bar so that the bar intersects the middle of the feet.\nReverse Curl (Barbell)|Biceps|Barbell|wr|Stand up with your torso upright while holding a barbell at shoulder width with the elbows close to the torso. The palm of your hands should be facing down (pronated grip).\nReverse Barbell Preacher Curl (EZ Bar)|Biceps|EZ Bar|wr|Grab an EZ-bar using a shoulder width and palms down (pronated) grip. Now place the upper part of both arms on top of the preacher bench and have your arms extended.\nReverse Curl (Cable)|Biceps|Cable|wr|Stand up with your torso upright while holding a bar attachment that is attached to a low pulley using a pronated (palms down) and shoulder width grip. Make sure also that you keep the elbows close to the torso.\nReverse Crunch|Abs|Bodyweight|bw|Lie down on the floor with your legs fully extended and arms to the side of your torso with the palms on the floor. Your arms should be stationary for the entire exercise.\nReverse Fly (Dumbbell)|Shoulders|Dumbbell|wr|To begin, lie down on an incline bench with the chest and stomach pressing against the incline. Have the dumbbells in each hand with the palms facing each other (neutral grip).\nReverse Fly with External Rotation (Dumbbell)|Shoulders|Dumbbell|wr|To begin, lie down on an incline bench set at a 30-degree angle with the chest and stomach pressing against the incline. Have the dumbbells in each hand with the palms facing down to the floor.\nReverse Grip Bent-Over Row (Barbell)|Back|Barbell|wr|Stand erect while holding a barbell with a supinated grip (palms facing up). Bend your knees slightly and bring your torso forward, by bending at the waist, while keeping the back straight until it is almost parallel to the floor.\nReverse Grip Triceps Pushdown (Cable)|Triceps|Cable|wr|Start by setting a bar attachment (straight or e-z) on a high pulley machine. Facing the bar attachment, grab it with the palms facing up (supinated grip) at shoulder width. Lower the bar by using your lats until your arms are fully extended by your sides.\nReverse Hyperextension (Machine)|Hamstrings|Machine|wr|Place your feet between the pads after loading an appropriate weight. Lay on the top pad, allowing your hips to hang off the back, while grasping the handles to hold your position. To begin the movement, flex the hips, pulling the legs forward.\nReverse Fly (Machine)|Shoulders|Machine|wr|Adjust the handles so that they are fully to the rear. Make an appropriate weight selection and adjust the seat height so the handles are at shoulder level. Grasp the handles with your hands facing inwards.\nReverse Plate Curl|Biceps|Other|wr|Start by standing straight with a weighted plate held by both hands and arms fully extended. Use a pronated grip (palms facing down) and make sure your fingers grab the rough side of the plate while your thumb grabs the smooth side.\nReverse Triceps Bench Press (Barbell)|Triceps|Barbell|wr|Lie back on a flat bench. Using a close, supinated grip (around shoulder width), lift the bar from the rack and hold it straight over you with your arms locked extended in front of you and perpendicular to the floor.\nRickshaw Carry|Forearms|Other|dur|Position the frame at the starting point, and load with the appropriate weight. Standing in the center of the frame, begin by gripping the rom it. Seat yourself on the bench and secure the band behind your ankles, beginning with your legs straight. Flex the knees, bringing your feet towards the bench.\nSeated Military Press (Barbell)|Shoulders|Barbell|wr|Sit on a Military Press Bench with a bar behind your head and either have a spotter give you the bar (better on the rotator cuff this way) or pick it up yourself carefully with a pronated grip (palms facing forward).\nSeated Twist (Barbell)|Abs|Barbell|wr|Start out by sitting at the end of a flat bench with a barbell placed on top of your thighs. Your feet should be shoulder width apart from each other.\nSeated Bent-Over Single Arm Triceps Extension (Dumbbell)|Triceps|Dumbbell|wr|Sit down at the end of a flat bench with a dumbbell in one arm using a neutral grip (palms of the hand facing you).\nSeated Bent-Over Rear Delt Raise (Dumbbell)|Shoulders|Dumbbell|wr|Place a couple of dumbbells looking forward in front of a flat bench. Sit on the end of the bench with your legs together and the dumbbells behind your calves. Bend at the waist while keeping the back straight in order to pick up the dumbbells.\nSeated Bent-Over Two-Arm Triceps Extension (Dumbbell)|Triceps|Dumbbell|wr|Sit down at the end of a flat bench with a dumbbell in both arms using a neutral grip (palms of the hand facing you).\nSeated Row (Cable)|Back|Cable|wr|For this exercise you will need access to a low pulley row machine with a V-bar. Note: The V-bar will enable you to have a neutral grip where the palms of your hands face each other.\nSeated Shoulder Press (Cable)|Shoulders|Cable|wr|Adjust the weight to an appropriate amount and be seated, grasping the handles. Your upper arms should be about 90 degrees to the body, with your head and chest up. The elbows should also be bent to about 90 degrees.\nSeated Close-Grip Concentration Curl (Barbell)|Biceps|Barbell|wr|Sit down on a flat bench with a barbell or E-Z Bar in front of you in between your legs. Your legs should be spread with the knees bent and the feet on the floor.\nSeated Curl (Dumbbell)|Biceps|Dumbbell|wr|Sit on a flat bench with a dumbbell on each hand being held at arms length. The elbows should be close to the torso. Rotate the palms of the hands so that they are facing your torso.\nSeated Inner Biceps Curl (Dumbbell)|Biceps|Dumbbell|wr|Sit on the end of a flat bench with a dumbbell in each hand being held at arms length. The elbows should be close to the torso. Rotate the palms of the hands so that they are facing inward in a neutral position.\nSeated Palms-Down Wrist Curl (Dumbbell)|Forearms|Dumbbell|wr|Start out by placing two dumbbells on the floor in front of a flat bench. Sit down on the edge of the flat bench with your legs at about shoulder width apart. Make sure to keep your feet on the floor.\nSeated Palms-Up Wrist Curl (Dumbbell)|Forearms|Dumbbell|wr|Start out by placing two dumbbells on the floor in front of a flat bench. Sit down on the edge of the flat bench with your legs at about shoulder width apart. Make sure to keep your feet on the floor.\nSeated Press (Dumbbell)|Shoulders|Dumbbell|wr|Grab a couple of dumbbells and sit on a military press bench or a utility bench that has a back support on it as you place the dumbbells upright on top of your thighs.\nSeated Flat Bench Leg Pull-In|Abs|Bodyweight|bw|Sit on a bench with the legs stretched out in front of you slightly below parallel and your arms holding on to the sides of the bench. Your torso should be leaning backwards around a 45-degree angle from the bench.\nSeated Good Mornings (Barbell)|Back|Barbell|wr|Set up a box in a power rack. The pins should be set at an appropriate height. Begin by stepping under the bar and placing it across the back of the shoulders, not on top of your traps.\nSeated Head Harness Neck Resistance|Neck|Other|bw|Place a neck strap on the floor at the end of a flat bench. Once you have selected the weights, sit at the end of the flat bench with your feet wider than shoulder width apart from e or securely anchor it in a corner. Load the bar to an appropriate weight. Raise the bar from the floor, taking it to your shoulders with one or both hands. Adopt a wide stance.\nSingle-Arm Push Up|Chest|Bodyweight|bw|Begin laying prone on the ground. Move yourself into a position supporting your weight on your toes and one arm. Your working arm should be placed directly under the shoulder, fully extended.\nSingle-Cone Sprint Drill|Quads|Other|bw|This drill teaches quick foot action. You need a single cone. Begin standing next to the cone with one arm back and one arm forward. Chop the feet as quickly as possible, blocking with the arms. Circle the cone, keep your knees up, with violent foot action.\nSingle-Leg High Box Squat|Quads|Other|wr|Position a box in a rack. Secure a band or rope in place above the box. Standing in front of it, step onto the box to a full standing position, letting your other leg remain unsupported. Hold onto the band for balance .\nSingle-Leg Hop Progression|Quads|Other|bw|Arrange a line of cones in front of you. Assume a relaxed standing position, balanced on one leg. Raise the knee of your opposite leg. Hop forward, jumping and landing with the same leg over the cone. Use a countermovement jump to hop from cone to cone.\nSingle-Leg Lateral Hop|Quads|Other|bw|Stand to the side of a cone or hurdle. To get into the start position, stand on one leg with your knee slightly bent. To begin, execute a counterjump to hop sideways over the cone.\nSingle-Leg Leg Extension (Machine)|Quads|Machine|wr|Seat yourself in the machine and adjust it so that you are positioned properly. The pad should be against the lower part of the shin but not in contact with the ankle. Adjust the seat so that the pivot point is in line with your knee.\nSingle-Leg Stride Jump|Quads|Other|bw|Stand to the side of a box with your inside foot on top of it, close to the edge. Begin by swinging the arms upward as you push through the top leg, jumping upward as high as possible. e almost fully extended.\nLeg Press (Smith Machine)|Quads|Smith Machine|wr|Position a Smith machine bar a couple feet off of the ground. Ensure that it is resting on the safeties. After loading the bar to an appropriate weight, lie underneath the bar. Place the middle of your feet on the bar, tucking your knees to your chest.\nSingle Arm Upright Row (Smith Machine)|Shoulders|Smith Machine|wr|With the bar at thigh level, load an appropriate weight. Take a wide grip on the bar and unhook the weight, removing your off hand from the bar. Your arm should be extended as you stand up straight with your head and chest up.\nOverhead Shoulder Press (Smith Machine)|Shoulders|Smith Machine|wr|To begin, place a flat bench (or preferably one with back support) underneath a smith machine. Position the barbell at a height so that when seated on the flat bench, the arms must be almost fully extended to reach the barbell.\nPistol Squat (Smith Machine)|Quads|Smith Machine|wr|To begin, first set the bar to a position that best matches your height. Step under it and position the bar across the back of your shoulders. Take the bar with your hands facing forward, unlock it and lift it off the rack by extending your legs. 3\nReverse Calf Raise (Smith Machine)|Calves|Smith Machine|wr|Adjust the barbell on the smith machine to fit your height and align a raised platform right under the bar. Stand on the platform with the heels of your feet secured on top of it with the balls of your feet extending off it.\nSquat (Smith Machine)|Quads|Smith Machine|wr|To begin, first set the bar on the height that best matches your height. Once the correct height is chosen and the bar is loaded, step under the bar and place the back of your shoulders (slightly below the neck) across it.\nStiff-Legged Deadlift (Smith Machine)|Hamstrings|Smith Machine|wr|To begin, set the bar on the smith machine to a height that is around the middle of your thighs. Once the correct height is chosen and the bar is loaded, grasp the bar using a pronated (palms forward) grip that is shoulder width apart.\nUpright Row (Smith Machine)|Traps|Smith Machine|wr|To begin, set the bar on the smith machine to a height that is around the middle of your thighs. Once the correct height is chosen and the bar is loaded, grasp the bar using a pronated (palms forward) grip that is shoulder width apart.\nSingle-Leg Split Squat (Smith Machine)|Quads|Smith Machine|wr|To begin, place a flat bench 2-3 feet behind the smith machine. Then, set the bar on the height that best matches your height.\nSnatch (Barbell)|Quads|Barbell|wr|Place your feet at a shoulder width stance with the barbell resting right above the connection between the toes and the rest of the foot.\nSnatch Balance (Barbell)|Quads|Barbell|wr|Begin with the feet in the pulling position, the bar racked across the back of the shoulders, and the hands placed in a wide snatch grip.\nSnatch Deadlift (Barbell)|Hamstrings|Barbell|wr|The snatch deadlift strengthens the first pull of the snatch. Begin with a wide snatch grip with the barbell placed on the platform. The feet should be directly under the hips, with the feet turned out.\nSnatch Pull (Barbell)|Hamstrings|Barbell|wr|With a barbell on the floor close to the shins, take a wide snatch grip. Lower your hips with the weight focused on the heels, back straight, head facing forward, chest up, with your shoulders just in front of the bar.\nSnatch Shrug (Barbell)|Traps|Barbell|wr|Begin with a wide grip, with the bar hanging at the mid thigh position. You can use a hook or overhand grip. Your back should be straight and inclined slightly forward. Shrug your shoulders towards your ears.\nSnatch from Blocks (Barbell)|Quads|Barbell|wr|Begin with a loaded barbell on boxes or stands of the desired height. A wide grip should be taken on the bar. The feet should be directly below the hips, with the feet turned out as needed. Lower the hips, with the chest up and the head looking forward.\nSpeed Overhead Triceps  loaded bar at shoulder level in a rack. With a pronated grip at shoulder width, begin with the bar racked across the front of your shoulders. Initiate the lift by extending the elbows to press the bar overhead.\nStanding Chest Press (Cable)|Chest|Cable|wr|Position dual pulleys to chest height and select an appropriate weight. Stand a foot or two in front of the cables, holding one in each hand. You can stagger your stance for better stability.\nStanding Lift (Cable)|Abs|Cable|wr|Connect a standard handle on a tower, and move the cable to the lowest pulley position. With your side to the cable, grab the handle with one hand and step away from the tower.\nStanding Wood Chop (Cable)|Abs|Cable|wr|Connect a standard handle to a tower, and move the cable to the highest pulley position. With your side to the cable, grab the handle with one hand and step away from the tower.\nStanding Concentration Curl (Dumbbell)|Biceps|Dumbbell|wr|Taking a dumbbell in your working hand, lean forward. Allow your working arm to hang perpendicular to the ground with the elbow pointing out. Flex the elbow to curl the weight, keeping the upper arm stationary.\nStanding Calf Raise (Dumbbell)|Calves|Dumbbell|wr|Stand with your torso upright holding two dumbbells in your hands by your sides. Place the ball of the foot on a sturdy and stable wooden board (that is around 2-3 inches tall) while your heels extend off and touch the floor.\nStanding Press (Dumbbell)|Shoulders|Dumbbell|wr|Standing with your feet shoulder width apart, take a dumbbell in each hand. Raise the dumbbells to head height, the elbows out and about 90 degrees.\nStanding Reverse Curl (Dumbbell)|Biceps|Dumbbell|wr|To begin, stand straight with a dumbbell in each hand using a pronated grip (palms facing down). Your arms should be fully extended while your feet are shoulder width apart from each other.\nStanding Straight-Arm Front Delt Raise Above Head (Dumbbell)|Shoulders|Dumbbell|wr|Hold the dumbbells in front of your thighs, palms facing your thighs. Keep your arms straight with a slight bend at the elbows but keep them locked. Raise the dumbbells in a semicircular motion to arm\'s length overhead as you exhale.\nStanding Triceps Extension (Dumbbell)|Triceps|Dumbbell|wr|To begin, stand up with a dumbbell held by both hands. Your feet should be about shoulder width apart from each other. Slowly use both hands to grab the dumbbell and lift it over your head until both arms are fully extended.\nStanding Upright Row (Dumbbell)|Traps|Dumbbell|wr|Grasp a dumbbell in each hand with a pronated (palms forward) grip that is slightly less than shoulder width. The dumbbells should be resting on top of your thighs. Your arms should be extended with a slight bend at the elbows and your back should be straight.\nStanding Front Raise over Head (Barbell)|Shoulders|Barbell|wr|To begin, stand straight with a barbell in your hands. You should grip the bar with palms facing down and a closer than shoulder width grip apart from each other. Your feet should be shoulder width apart from each other. Your elbows should be slightly bent.\nStanding Inner-Biceps Curl (Dumbbell)|Biceps|Dumbbell|wr|Stand up with a dumbbell in each hand being held at arms length. The elbows should be close to the torso. Your legs should be at about shoulder\'s width apart from each other. Rotate the palms of the hands so that they are facing inward in a neutral position.\nStanding Leg Curl (Machine)|Hamstrings|Machine|wr|\nStanding Long Jump|Quads|Bodyweight|bw|This drill is best done in sand or other soft landing surface. Ensure that you are able to measure distance. Stand in a partial squat stance with feet shoulder width apart.\nStanding Low - Deltoid Raise (Cable)|Shoulders|Cable|wr|Start by standing to the right side of a low pulley row. Use your left hand to come across the body and grab a single handle attached to the low pulley with a pronated grip (palms facing down). Rest your arm in front of you.\nStanding Low - Single Arm Tri lls up until you create a 90 degree angle with your arms.\nStanding Palms-Up Behind the Back Wrist Curl (Barbell)|Forearms|Barbell|wr|Start by standing straight and holding a barbell behind your glutes at arm\'s length while using a pronated grip (palms will be facing back away from the glutes) and having your hands shoulder width apart from each other.\nStanding Rope Crunch (Cable)|Abs|Cable|wr|Attach a rope to a high pulley and select an appropriate weight. Stand with your back to the cable tower. Take the rope with both hands over your shoulders, holding it to your upper chest.\nStanding Towel Triceps Extension|Triceps|Bodyweight|bw|To begin, stand up with both arms fully extended above the head holding one end of a towel with both hands.\nStanding Two-Arm Overhead Throw (Medicine Ball)|Shoulders|Medicine Ball|wr|Stand with your feet shoulder width apart holding a medicine ball in both hands. To begin, reach the medicine ball deep behind your head as you bend the knees slightly and lean back.\nStar Jump|Quads|Bodyweight|bw|Begin in a relaxed stance with your feet shoulder width apart and hold your arms close to the body. To initiate the move, squat down halfway and explode back up as high as possible. Fully extend your entire body, spreading your legs and arms away from the body.\nStep Mill (Machine)|Cardio|Machine|dur|To begin, step onto the stepmill and select the desired option from the menu. You can choose a manual setting, or you can select a program to run. Typically, you can enter your age and weight to estimate the amount of calories burned during exercise.\nStep-Up with Knee Raise|Glutes|Bodyweight|bw|Stand facing a box or bench of an appropriate height with your feet together. Begin the movement by stepping up, putting your left foot on the top of the bench. Extend through the hip and knee of your front leg to stand up on the box.\nStiff Leg Good Morning (Barbell)|Back|Barbell|wr|This exercise is best performed inside a squat rack for safety purposes. To begin, first set the bar on a rack that best matches your height.\nStiff-Legged Deadlift (Barbell)|Hamstrings|Barbell|wr|Grasp a bar using an overhand grip (palms facing down). You may need some wrist wraps if using a significant amount of weight. Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent.\nStiff-Legged Deadlift (Dumbbell)|Hamstrings|Dumbbell|wr|Grasp a couple of dumbbells holding them by your side at arm\'s length. Stand with your torso straight and your legs spaced using a shoulder width or narrower stance. The knees should be slightly bent.\nStraight Bar Bench Mid Row (Barbell)|Back|Barbell|wr|Place a loaded barbell on the end of a bench. Standing on the bench behind the bar, take a medium, pronated grip. Stand with your hips back and chest up, maintaining a neutral spine.\nStraight Raise on Incline Bench (Barbell)|Shoulders|Barbell|wr|Place a bar on the ground behind the head of an incline bench. Lay on the bench face down. With a pronated grip, pick the barbell up from the floor, keeping your arms straight. Allow the bar to hang straight down.\nStraight-Arm Pullover (Dumbbell)|Chest|Dumbbell|wr|Place a dumbbell standing up on a flat bench. Ensuring that the dumbbell stays securely placed at the top of the bench, lie perpendicular to the bench (torso across it as in forming a cross) with only your shoulders lying on the surface.\nStraight-Arm Pulldown (Cable)|Back|Cable|wr|You will start by grabbing the wide bar from the top pulley of a pulldown machine and using a wider than shoulder-width pronated (palms down) grip. Step backwards two feet or so.\nStride Jump Crossover|Quads|Other|bw|Stand to the side of a box with your inside foot on top of it, close to the edge. Begin by swinging the arms upward as you push through the top leg, jumping upward as high as possible. Attempt to drive the opposite knee upward.\nSumo Deadlift (Barbell)|Hamstrings|Barbell|wr|Begin with a bar loaded on the ground. Approach the bar so that the bar intersects the middle of the feet. The feet should be set very wide, near the collars. Bend at the hips to grip the bar.\nSumo Deadlift with Bands (Barbell)|Hamstrings|Barbell|wr|To deadlift with short bands, simply loop them over the bar before you start, and step into them to set up. Ensure that they under the back half of your foot, directly where you are driving into the floor. Begin with a bar loaded on the ground.\nSumo Deadlift with Chains (Barbell)|Hamstrings|Barbell|wr|You can attach the chains to the sleeves of the bar, or just drape the middle over the bar so there is a greater weight increase as you lift. Attempt to keep the ends of the chains away from the plates so you don\'t hit them when you lower the weight.\nSupine Chest Throw (Medicine Ball)|Triceps|Medicine Ball|wr|This drill is great for chest passes when you lack a partner or a wall of sufficient strength. Lay on the ground on your back with your knees bent. Begin with the ball on your chest, held with both hands on the bottom.\nSupine Single Arm Overhead Throw (Medicine Ball)|Abs|Medicine Ball|wr|Lay on the ground on your back with your knees bent. Hold the ball with one hand, extending the arm fully behind your head. Initiate the movement at the shoulder, throwing the ball directly forward of you as you sit up, attempting to go for maximum distance.\nSupine Two-Arm Overhead Throw (Medicine Ball)|Abs|Medicine Ball|wr|Lay on the ground on your back with your knees bent. Hold the ball with both hands, extending the arms fully behind your head. Initiate the movement at the shoulder, throwing the ball directly forward of you as you sit up, attempting to go for maximum distance.\nSuspended Fallout|Abs|Other|bw|Adjust the straps so the handles are at an appropriate height, below waist level. Begin standing and grasping the handles. Lean into the straps, moving to an incline push-up position.\nSuspended Push Up|Chest|Other|bw|Anchor your suspension  weight you are comfortable with. When your legs are positioned properly on the leg pads of the machine, grip the handles on each side. Your entire upper body (from the waist up) should be stationary.\nTire Flip|Quads|Other|bw|Begin by gripping the bottom of the tire on the tread, and position your feet back a bit. Your chest should be driving into the tire. To lift the tire, extend through the hips, knees, and ankles, driving into the tire and up.\nTrail Running/Walking|Cardio|Other|cd|Running or hiking on trails will get the blood pumping and heart beating almost immediately. Make sure you have good shoes.\nTrap Bar Deadlift|Quads|Other|wr|For this exercise load a trap bar, also known as a hex bar, to an appropriate weight resting on the ground. Stand in the center of the apparatus and grasp both handles. Lower your hips, look forward with your head and keep your chest up.\nTricep Kickback (Dumbbell)|Triceps|Dumbbell|wr|Start with a dumbbell in each hand and your palms facing your torso. Keep your back straight with a slight bend in the knees and bend forward at the waist. Your torso should be almost parallel to the floor. Make sure to keep your head up.\nTriceps Pushdown - Rope Attachment (Cable)|Triceps|Cable|wr|Attach a rope attachment to a high pulley and grab with a neutral grip (palms facing each other). Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor.\nTriceps Pushdown - V-Bar Attachment (Cable)|Triceps|Cable|wr|Attach a V-Bar to a high pulley and grab with an overhand grip (palms facing down) at shoulder width. Standing upright with the torso straight and a very small inclination forward, bring the upper arms close to your body and perpendicular to the floor.\nTuck Crunch|Abs|Bodyweight|bw|To begin, lie down on the floor or an exercise mat with your back pressed against the floor. Your arms should be lying across your sides with the palms facing down. Your const fmtSet=(t,s)=>{if(!s)return'';const kg=fmtN(toU(s.kg||0)),u=UNIT(),r=s.reps??0,q=s.rpe?` @${s.rpe}`:'';switch(t){case'wbw':return`+${kg} ${u} × ${r}${q}`;case'bw':return`${r} reps${q}`;case'dur':return fmtSec(s.sec);case'cd':return`${fmtN(s.km||0)} km · ${fmtSec(s.sec)}`;default:return`${kg} ${u} × ${r}${q}`}};
