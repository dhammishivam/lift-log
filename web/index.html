let WS=[],RS=[],MS=[],EX={},H={},PRM={};
const ex=id=>EX[id]||{id,name:'Unknown exercise',muscle:'Other',equip:'Other',type:'wr'};
function index(){
  const d=Object.values(S.docs);
  WS=d.filter(x=>x&&x.kind==='workout').sort((a,b)=>b.start-a.start);
  MS=d.filter(x=>x&&x.kind==='measure').sort((a,b)=>b.date-a.date);
  RS=d.filter(x=>x&&x.kind==='routine').sort((a,b)=>(a.created||0)-(b.created||0));
  EX={};LIB.forEach(x=>EX[x.id]=x);
  // A custom exercise with a library name replaces that entry and borrows its muscle, equipment and cue if it has none.
  const LBN={};LIB.forEach(x=>LBN[x.name.toLowerCase()]=x);
  d.filter(x=>x&&x.kind==='exercise').forEach(x=>{const l=LBN[(x.name||'').toLowerCase()];if(l)delete EX[l.id];
    EX[x.id]={...x,muscle:(!x.muscle||x.muscle==='Other')&&l?l.muscle:x.muscle,equip:(!x.equip||x.equip==='Other')&&l?l.equip:x.equip,cue:x.cue||(l&&l.cue),custom:true}});
  H={};PRM={};const run={};
  [...WS].reverse().forEach(w=>{const pm={n:0,m:{}};PRM[w.id]=pm;
    (w.exercises||[]).forEach((it,ei)=>{const t=ex(it.eid).type,keys=PRKEYS[t]||[],best=run[it.eid];
      (H[it.eid]||(H[it.eid]=[])).push({wid:w.id,start:w.start,sets:it.sets||[],rest:it.rest,w});
      const mx={},at={};keys.forEach(k=>{mx[k]=0;at[k]=-1});
      (it.sets||[]).forEach((s,si)=>{if(s.t==='w')return;const m=setM(s);keys.forEach(k=>{if(m[k]>mx[k]){mx[k]=m[k];at[k]=si}})});
      if(best)keys.forEach(k=>{if(at[k]>=0&&mx[k]>best[k]+1e-9){const key=ei+':'+at[k];(pm.m[key]||(pm.m[key]=[])).push(k)}});
      run[it.eid]=best?Object.fromEntries(keys.map(k=>[k,Math.max(best[k],mx[k])])):mx});
    pm.n=Object.values(pm.m).reduce((q,a)=>q+a.length,0)});
  Object.values(H).forEach(a=>a.reverse());
}

/* Lift Log's own mascots (original characters): heaviest weight → titan, best 1RM → classic, other records → pump, a saved workout with records → champ. */
const QUIPS={titan:['The bar bent. You didn\'t.','Heavier than ever. The plates fear you.','New weight unlocked. ROAR!'],classic:['Strength like the golden days.','Timeless power. Hit a pose!','That 1RM belongs in a museum.'],pump:['That pump is going on the vlog!','More reps, more gains, more content.','Volume king! Hit subscribe on yourself.'],champ:['Champion\'s day! Take a bow.','Records broken. Trophy earned.','That workout belongs on a stage.']};
const mascotFor=k=>k==='w'?'titan':k==='orm'?'classic':'pump';
function celebrate(m,title,line){if(settings().cele===false)return false;document.querySelector('.cele')?.remove();
  const d=document.createElement('div');d.className='cele';const q=QUIPS[m][Math.floor(Math.random()*QUIPS[m].length)],cols=['#d99a00','#ffd34d','#3d84ff','#22c55e','#ef4444','#9b7bf5'];
  let cf='';for(let i=0;i<70;i++)cf+=`<i class="cf" style="left:${Math.random()*100}%;background:${cols[i%6]};width:${6+Math.random()*8}px;height:${10+Math.random()*10}px;--dx:${Math.round(Math.random()*80-40)}px;--r:${Math.round(Math.random()*720-360)}deg;animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.5}s"></i>`;
  d.innerHTML=cf+`<div class="cc"><div class="cb"><img src="${MASCOT[m]}" alt=""></div><h3>${esc(title)}</h3><p class="l">${esc(line)}</p><p class="q">“${esc(q)}”</p></div>`;
  d.addEventListener('click',()=>d.remove());document.body.appendChild(d);setTimeout(()=>d.remove(),3400);try{navigator.vibrate&&navigator.vibrate([35,70,35,70,60])}catch(e){}return true}

const ALSO={'Front delts':'Side delts','Rear delts':'Side delts'};
// Fibre direction per muscle (degrees, SVG y-down) on the figure's left half; the right half mirrors it.
const FIB={Chest:15,Abs:90,Obliques:45,'Front delts':80,'Side delts':85,'Rear delts':80,Biceps:100,Triceps:100,Forearms:105,Traps:-27,
  Quads:80,Adductors:112,Abductors:100,Calves:90,Hamstrings:88,Glutes:140,Lats:59,'Upper back':17,'Lower back':90};
function bodyMap(lv,sh,sel,small,tap){const L=m=>Math.max(lv[m]||0,lv[ALSO[m]]||0);
  const side=(k,l)=>{const v=BODY[k],cx=v.vb[0]+v.vb[2]/2,used=new Set();
    const ang=(m,d)=>{const x=+(/M\s*(-?[\d.]+)/.exec(d)||[0,cx])[1],f=FIB[m];if(f==null)return null;const dd=x<cx?f:180-f,a=Math.round((dd-90)/5)*5;used.add(a);return a};
    const body=Object.entries(v.regions).map(([m,ps])=>{const on=m===sel||ALSO[m]===sel,c=sh[L(m)];
      return`<g ${tap?`data-a="msel" data-m="${m}" style="cursor:pointer"`:''}><title>${m}</title>${ps.map(d=>{const a=ang(m,d);
        return`<path d="${d}" fill="${c}"/>${a==null?'':`<path d="${d}" fill="url(#fb${a})"/>`}<path d="${d}" fill="url(#vol)" style="stroke:${on?'var(--ink)':'var(--bg)'};stroke-width:${on?7:1.6}"/>`}).join('')}</g>`}).join('');
    const defs=`<defs><radialGradient id="vol" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset=".78" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></radialGradient>
      <filter id="bsh" x="-20%" y="-10%" width="140%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".55"/></filter>
      ${[...used].map(a=>`<pattern id="fb${a}" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(${a})"><rect width="2.4" height="11" fill="#000" fill-opacity=".2"/><rect x="5.5" width="1.4" height="11" fill="#fff" fill-opacity=".07"/></pattern>`).join('')}</defs>`;
    return`<figure><svg viewBox="${v.vb.join(' ')}" role="img" aria-label="${l} view">${defs}<g filter="url(#bsh)"><path d="${v.base.join(' ')}" style="fill:color-mix(in srgb,var(--ink) 22%,var(--s2))"/></g>${v.base.map(d=>`<path d="${d}" fill="url(#vol)"/>`).join('')}${body}</svg><figcaption>${l}</figcaption></figure>`};
  return`<div class="bmap${small?' sm':''}">${side('front','Front')}${side('back','Back')}</div>`}
const legend=(sh,ls)=>`<div class="mlg">${ls.map((l,i)=>`<span><i style="background:${sh[i]}"></i>${l}</span>`).join('')}</div><p class="mu" style="font-size:10px;margin-top:6px">Body art: react-native-body-highlighter © 2022 ELABBASSI Hicham (MIT)</p>`;
function musclesWorked(cnt){if(!Object.keys(cnt).length)return'';const mx=Math.max(1,...Object.values(cnt));
  return`<div class="mwk"><h3 class="h3">Muscles worked</h3>${bodyMap(Object.fromEntries(Object.entries(cnt).map(([m,v])=>[m,sessionLevel(v)])),VSH,null,true)}
  ${Object.entries(cnt).map(([m,v])=>`<div class="mrow" style="cursor:default"><span>${m}</span><span class="mt"><i style="width:${v/mx*100}%;background:${VSH[sessionLevel(v)]}"></i></span><b>${sl(v)}</b></div>`).join('')}
  <p class="mu" style="font-size:13px">Sets per muscle; muscles that help count half a set.</p></div>`}
// Training balance across six groups: this period filled, the previous one dashed.
function radar(cur,prev){const ax=['Back','Chest','Core','Shoulders','Arms','Legs'],mx=Math.max(1,...ax.map(a=>Math.max(cur[a]||0,prev[a]||0))),c=[150,124],r=86;

  case'setrest':{const v=await menu('Default rest timer',RESTS.map(s=>({l:fmtRest(s),v:String(s),on:s===settings().rest})));if(v!=null){put('settings',{...settings(),kind:'settings',rest:+v});paint(sh)}break}
  case'copyjson':{const docs={};Object.entries(S.docs).forEach(([k,v])=>{if(v&&v.kind!=='active')docs[k]=v});const json=JSON.stringify({app:'liftlog',v:1,exported:new Date().toISOString(),docs});
    try{await navigator.clipboard.writeText(json);toast('Backup copied to clipboard')}catch(err){sh.st.json=json;paint(sh)}break}
  case'showrestore':sh.st.restore=!sh.st.restore;paint(sh);break;
  case'restore':restoreJSON(sh);break;
  }});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;const sh=sheetOf(t);
  if(f==='exq'){UI.exq=t.value;$('#exlist').innerHTML=exListHTML();return}
  if(!sh)return;
  if(f==='pq'){sh.st.q=t.value;repaintPick(sh);return}
  if(f==='rname'){sh.st.r.name=t.value;return}
  if(f==='rtl'){sh.st.t=t.value;return}
  if(f==='wname'){sh.st.name=t.value;return}
  if(f==='ftitle'){sh.st.title=t.value;return}
  if(f==='fnotes'){sh.st.notes=t.value;return}
  if(f==='fmin'){sh.st.min=num(t.value)||1;return}
  if(f==='pg'){sh.st[t.dataset.k]=t.value;return}
  if(f==='mv'){const v=num(t.value),k=t.dataset.k;if(v==null)delete sh.st.e.v[k];else sh.st.e.v[k]=mStore(k,v);return}
  if(f==='rfold'){sh.st.r.folder=t.value;return}
  if(f==='pinx'){sh.st.t=t.value;return}
  if(f==='cin'){sh.st.inp=t.value;t.style.height='auto';t.style.height=Math.min(140,t.scrollHeight)+'px';return}
  if(f==='pw'){sh.st.w=t.value;repart(sh,'#pres',plateRes(sh.st));return}
  if(f==='ow'||f==='or'){sh.st[f==='ow'?'w':'r']=t.value;repart(sh,'#ores',ormRes(sh.st));return}
  if(f==='mdate'){const p=t.value.split('-').map(Number);if(p.length===3&&p[0])sh.st.e.date=new Date(p[0],p[1]-1,p[2],12).getTime();return}
  if(f==='fwhen'){const v=Date.parse(t.value);if(isFinite(v))sh.st.when=v;return}
  const m=modelOf(sh);if(!m)return;const ei=+t.dataset.ei,it=m.exercises[ei];if(!it)return;
  if(f==='note'){it.note=t.value;touch(sh);return}
  const s=it.sets[+t.dataset.si];if(!s)return;setF(s,f,num(t.value));
  if(sh.kind==='live'){if(s.done){markPRs(m,ei);sh.el.querySelectorAll(`.row[data-ei="${ei}"]`).forEach(r=>r.classList.toggle('pr',!!(it.sets[+r.dataset.si]||{}).pr))}updLiveStats();touch(sh)}});
document.addEventListener('change',e=>{const t=e.target,f=t.dataset.f,sh=sheetOf(t);if(!f||!sh)return;
  if(f==='fupd')sh.st.upd=t.checked;
  if(f==='hevy'&&t.files&&t.files.length)importHevy([...t.files],sh);
  if(f==='mphoto'&&t.files&&t.files.length&&ASSETS){addPhotos([...t.files],sh);t.value=''}});
// Hevy files can also be dropped anywhere on the Move from Hevy guide.
document.addEventListener('dragover',e=>{if(SH.some(x=>x.kind==='hevy'))e.preventDefault()});
document.addEventListener('drop',e=>{const sh=SH.find(x=>x.kind==='hevy');if(!sh||!e.dataTransfer||!e.dataTransfer.files.length)return;e.preventDefault();importHevy([...e.dataTransfer.files],sh)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target.dataset&&e.target.dataset.f==='cin'&&matchMedia('(pointer:fine)').matches){e.preventDefault();const sh=sheetOf(e.target);if(sh)coachAsk(sh,sh.st.inp);return}if(e.key==='Escape'&&SH.length){const top=SH[SH.length-1];if(top.kind==='live')flush();closeSheet(top)}
  if(e.key==='Enter'&&e.target.matches('.row input')){const ins=[...SH[SH.length-1].el.querySelectorAll('.row input')],i=ins.indexOf(e.target);if(ins[i+1]){e.preventDefault();ins[i+1].focus()}}});
addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TABS.includes(t)&&t!==UI.tab){UI.tab=t;renderMain(true)}});

/* ---------- boot + sync ---------- */
$('#gear').innerHTML=I.gear;
if(window.claude&&window.claude.use){window.claude.use('downloads').then(x=>{DL=x||null}).catch(()=>{});window.claude.use('sample').then(x=>{SAMPLE=x||null;SH.forEach(q=>{if(q.kind==='coach')paint(q)})}).catch(()=>{})}
index();renderMain(true);
function ingest(snap){if(snap.metadata.fromCache&&snap.empty)return;const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=clone(d.data())});
  Object.keys({...busy,...pend}).forEach(k=>{if(busy[k]||pend[k]){if(S.docs[k])m[k]=S.docs[k];else delete m[k]}});
  if(liveSheet()||saveT){if(A)m.active=A;else delete m.active}
  S.docs=m;A=m.active||null;index();saveCache();refresh()}
(async()=>{const use=window.claude&&window.claude.use;if(!use){MODE='local';maybeWelcome();return}
  let db=null,user=null;try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  let id=null;try{id=user?await user.id():null}catch(e){}
  if(!db||!id){MODE='local';refresh();maybeWelcome();return}
  try{COL=db.collection('data/users/'+id)}catch(e){MODE='local';maybeWelcome();return}
  MODE='cloud';const before=clone(S.docs);let first=true;
  window.claude.use('assets').then(a=>{ASSETS=a||null;SH.forEach(x=>{if(x.kind==='meas')paint(x)})}).catch(()=>{});
  const tm=setTimeout(()=>toast("Can't reach your saved data yet. Showing this device's copy."),10000);
  COL.onSnapshot(snap=>{ingest(snap);if(!snap.metadata.fromCache){clearTimeout(tm);if(first){first=false;let n=0;[...UNS].forEach(k=>{if(before[k]&&!S.docs[k]){S.docs[k]=before[k];push(k);n++}});UNS.clear();saveUns();if(n){index();saveCache();refresh()}maybeWelcome()}}},
    err=>{clearTimeout(tm);COL=null;MODE='local';maybeWelcome();toast('Sync stopped. Changes stay on this device for now.')});
})();
}
</script>
