<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e10">
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday tool with shipped-app polish
   IDEA a gym logbook: plate-stamped numerals on an iron ground
   PICTURE the live set table itself; weekly bars in history; a progress line per exercise
   COLOUR iron charcoal / chalk white ground, electric blue for action, green for done sets, gold for records
   TYPE Barlow Condensed for numbers + Inter for text
   LAYOUT one phone column (max 560px) with bottom tabs; sheets slide over full screen on every width */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d0e10);--s1:light-dark(#f2f3f5,#17191c);--s2:light-dark(#e5e7eb,#23262b);--ln:light-dark(#e3e5e9,#2a2e34);--ink:light-dark(#101215,#f3f5f8);--mu:light-dark(#5f6670,#9097a2);--ac:light-dark(#1764ff,#3d84ff);--acs:light-dark(#e7eeff,#132446);--ok:light-dark(#16a34a,#22c55e);--oks:light-dark(#e2f7e9,#0f2a1a);--wu:#e8930a;--dr:#9b7bf5;--fa:#ef4444;--pr:#d99a00;--num:'Barlow Condensed',Inter,system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
@media(min-width:600px){body{background:var(--s1)}#app{border-inline:1px solid var(--ln)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 6px max(16px,env(safe-area-inset-left))}
.top h1{margin:0;font:700 34px/1.05 var(--num);letter-spacing:-.01em}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--mu);flex:none}
.ib:hover{background:var(--s1);color:var(--ink)}
#main{flex:1;overflow-y:auto;padding:4px 16px 28px;overscroll-behavior:contain}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:500;color:var(--mu)}
.tabs button.on{color:var(--ac)}
.pill{display:flex;align-items:center;gap:10px;margin:0 12px 8px;padding:8px 8px 8px 16px;border-radius:14px;background:var(--acs);text-align:left;width:calc(100% - 24px)}

.pill b{font:700 22px var(--num);color:var(--ac)}
.pill i{font-style:normal;background:var(--ac);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.lbl{margin:18px 0 8px;font-size:15px;font-weight:600;color:var(--mu)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;background:var(--s1);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.pri{background:var(--ac);color:#fff}
.btn.wide{width:100%}
.btn.dng{color:var(--fa);background:transparent}
.big{width:100%;min-height:56px;border-radius:14px;background:var(--s1);display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:600;font-size:16px}
.big svg{color:var(--ac)}
.wkline{display:flex;gap:18px;margin-top:4px;font-size:15px;color:var(--mu)}
.wkline b{color:var(--ink);font:700 20px var(--num)}
.rcard{background:var(--s1);border-radius:16px;padding:14px 14px 14px 16px;margin-bottom:12px}

.rcard h3{margin:0;font-size:18px}
.mu{color:var(--mu)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 12px;font-size:15px}
.empty{background:var(--s1);border-radius:16px;padding:20px}
.empty p{margin:6px 0 14px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.wk{background:var(--s1);border-radius:16px;padding:14px 14px 10px;margin:4px 0 6px}
.wkh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}

.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:120px;margin-top:14px}
.bar{position:relative;height:100%}

.bx{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-top:6px}

.wc{display:block;width:100%;text-align:left;background:var(--s1);border-radius:16px;padding:14px 16px;margin-bottom:10px}

.wst{display:flex;gap:22px;margin:10px 0;flex-wrap:wrap}

.wc li{display:flex;justify-content:space-between;gap:12px}
.wc li span:last-child{white-space:nowrap;color:var(--mu)}
.search{display:flex;align-items:center;gap:8px;background:var(--s1);border-radius:12px;padding:0 12px;margin:4px 0 10px;color:var(--mu)}

.xr{display:flex;width:100%;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid var(--ln);text-align:left;min-height:58px}

.xr .t{flex:1}
.xr b{display:block;font-weight:600;font-size:16px}
.xr small{font-size:13px;color:var(--mu)}
.xr .r{font-size:13px;color:var(--mu);text-align:right;white-space:nowrap}
.xr.sel .xa{background:var(--ac);color:#fff}
.sheet{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;background:rgba(0,0,0,.45)}
.pane{width:100%;max-width:560px;height:100%;background:var(--bg);display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet.dlg{align-items:flex-end;z-index:30}
.sheet.dlg .pane{height:auto;max-height:85%;overflow-y:auto;border-radius:20px 20px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
@media(prefers-reduced-motion:reduce){.pane{animation:none}}
.hd{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;border-bottom:1px solid var(--ln)}
.hd h2{flex:1;margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .btn{min-height:38px}
.bd{flex:1;overflow-y:auto;padding:12px 16px 48px;overscroll-behavior:contain}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 16px;border-bottom:1px solid var(--ln)}
.stats.s4{grid-template-columns:repeat(4,minmax(0,1fr));padding:12px 0;border:0}
.stats small{display:block;font-size:13px;color:var(--mu)}
.stats b{font:600 22px/1.15 var(--num);white-space:nowrap}
.stats .ac{color:var(--ac)}
.card{padding:12px 0 12px;border-bottom:1px solid var(--ln)}
.ch{display:flex;align-items:center;gap:8px}
.exn{flex:1;text-align:left;font-size:17px;font-weight:600;color:var(--ac);min-height:40px}
.note{width:100%;border:0;background:transparent;padding:2px 0;outline:0}
.note::placeholder{color:var(--mu)}
.rest{display:inline-flex;align-items:center;gap:6px;color:var(--ac);font-size:14px;font-weight:500;min-height:36px}
.rest svg{width:16px;height:16px}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) 72px 60px 40px;gap:6px;align-items:center;padding:3px 4px;border-radius:10px;margin-top:2px}
.row.c1{grid-template-columns:36px minmax(0,1fr) 88px 40px}
.row.rt{grid-template-columns:36px minmax(0,1fr) 72px 60px}
.row.rt.c1{grid-template-columns:36px minmax(0,1fr) 88px}
.row.th{font-size:13px;font-weight:600;color:var(--mu);text-align:center;margin-top:6px}
.row.th span:nth-child(2){text-align:left}
.row.done{background:var(--oks)}
.sl{height:36px;border-radius:8px;font:700 18px var(--num);background:var(--s1)}
.row.done .sl{background:transparent}
.t-w{color:var(--wu)}
.t-d{color:var(--dr)}
.t-f{color:var(--fa)}
.pv{height:36px;text-align:left;font-size:14px;color:var(--mu);white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:4px}
.pv span{overflow:hidden;text-overflow:ellipsis}
.row input{width:100%;height:36px;border:0;border-radius:8px;background:var(--s1);text-align:center;font:600 19px var(--num);padding:0 4px;outline-offset:0}
.row input::placeholder{color:var(--mu);opacity:.75}
.row.done input{background:transparent}
.chk{width:36px;height:36px;border-radius:8px;background:var(--s2);display:grid;place-items:center;color:var(--mu)}
.row.done .chk{background:var(--ok);color:#fff}
.tr{color:var(--pr);display:inline-flex;flex:none}
.tr svg{width:16px;height:16px}
.row:not(.pr) .tr{display:none}
.add{width:100%;min-height:40px;margin-top:8px;border-radius:10px;background:var(--s1);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.cele{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cele .cc{width:min(360px,86vw);background:#17191c;border-radius:28px;padding:20px;text-align:center;animation:cpop .6s cubic-bezier(.34,1.56,.64,1)}
.cele .cb{animation:cbob .52s ease-in-out infinite alternate}.cele img{width:220px;height:220px;border-radius:24px;display:block;margin:0 auto;animation:cwig .26s ease-in-out infinite alternate}
.cele h3{color:var(--pr);font-size:24px;margin:14px 0 4px}.cele .l{color:#f3f5f8;font-weight:600;white-space:pre-line;margin:0}.cele .q{color:#9097a2;margin:8px 0 0}
.cf{position:absolute;top:-24px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}@keyframes cpop{from{transform:scale(.2)}to{transform:scale(1)}}
@keyframes cwig{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}@keyframes cbob{from{transform:translateY(0)}to{transform:translateY(-8px) scale(1.04)}}
@media (prefers-reduced-motion:reduce){.cele .cc,.cele .cb,.cele img,.cf{animation:none}.cf{display:none}}
.addrow{display:flex;gap:8px}
.startc{width:100%;display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--s1);text-align:left;margin-bottom:10px}.startc.pri{background:var(--acs)}
.startc i{flex:none;width:44px;height:44px;border-radius:12px;background:var(--s2);color:var(--ac);display:flex;align-items:center;justify-content:center}.startc.pri i{background:var(--ac);color:#fff}
.startc span{flex:1;display:flex;flex-direction:column;gap:2px}.startc b{font-size:17px}.startc small{color:var(--mu);font-size:14px;font-weight:400}.startc>svg{color:var(--mu);flex:none}
.pgl{margin:14px 0 6px;font-size:14px}.pgc{display:flex;flex-wrap:wrap;gap:6px}
.pgd{width:100%;display:flex;align-items:center;gap:16px;padding:16px;border-radius:14px;background:var(--s1);text-align:left;margin:5px 0}.pgd.on{background:var(--acs);outline:2px solid var(--ac)}
.pgd .n{font:700 28px var(--num)}.pgd span:not(.n){flex:1;display:flex;flex-direction:column}.pgd small{color:var(--mu);font-size:14px}.pgd>svg{color:var(--mu)}
.pgp{width:100%;display:block;text-align:left;padding:16px;border-radius:16px;background:var(--s1);margin:6px 0}.pgp.best{outline:2px solid var(--ac)}
.pgp .bm{color:var(--ac);font-size:13px;font-weight:700;display:block;margin-bottom:4px}.pgp b{display:block;font-size:18px}.pgp .m{color:var(--mu);font-size:14px;display:block}.pgp .nt{color:#e8930a;font-size:13px;display:block}
.pgp p{margin:8px 0 0;font-size:15px}.pgp .dd{color:var(--mu);font-size:13px;margin-top:6px;display:block}
.pgday{background:var(--s1);border-radius:16px;padding:14px;margin-top:12px}.pgday h4{margin:0 0 4px;color:var(--ac);font-size:17px}
.pgday div{display:flex;justify-content:space-between;gap:8px;padding-top:6px;font-size:15px}.pgday div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pgday div span:last-child{color:var(--mu);white-space:nowrap}.addrow .add.wu{width:auto;padding:0 14px;flex:none}.add.wu svg{color:#e8930a}

.add svg{width:16px;height:16px}
.addx{margin-top:16px}
.lempty{text-align:center;padding:40px 12px 20px}

.rb{position:relative;display:flex;align-items:center;gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:var(--s1);border-top:1px solid var(--ln);overflow:hidden}

.rbt{flex:1;text-align:center;font:700 32px/1 var(--num)}

.wh h2{margin:4px 0 2px;font-size:24px;line-height:1.15}

.h3{margin:22px 0 8px;font-size:16px}

const CUETXT=`Bench Press (Barbell)|Shoulder blades pinched and down, feet planted. Lower to mid-chest with elbows about 45° from your sides, then press up and slightly back.
Bench Press (Dumbbell)|Lower the dumbbells to chest level with elbows about 45° from your sides, then press up until your arms are straight.
Incline Bench Press (Barbell)|Bench at 30–45°. Lower to the upper chest, keep your shoulder blades back, press straight up.
Incline Bench Press (Dumbbell)|Bench at 30–45°. Lower to upper-chest level, press up and slightly together.
Decline Bench Press (Barbell)|Lock your legs in. Lower to the lower chest under control and press up.
Decline Bench Press (Dumbbell)|Lock your legs in. Lower to the lower chest, press up without bouncing.
Chest Press (Machine)|Set the seat so the handles line up with mid-chest. Press without slamming into lockout, return slowly.
Chest Fly (Dumbbell)|Slight bend in the elbows. Open wide until you feel a chest stretch, then hug the weights back up.
Butterfly (Pec Deck)|Back flat on the pad, elbows slightly bent. Squeeze the handles together and return slowly.
Cable Fly Crossovers|Step forward with a slight lean and soft elbows. Sweep the handles together in an arc and control the return.
Push Up|Body in a straight line, hands under the shoulders. Lower your chest to the floor with elbows about 45° out.
Chest Dip|Lean forward with elbows flaring slightly. Lower until shoulders are just below elbows, then press up.
Deadlift (Barbell)|Bar over mid-foot, flat back, lats tight. Push the floor away, keep the bar close, finish by squeezing your glutes.
Pull Up|Overhand grip slightly wider than shoulders. Pull your chest towards the bar, lower to a full hang.
Chin Up|Underhand grip about shoulder-width. Pull your chin over the bar, lower all the way down.
Pull Up (Weighted)|A pull-up with a belt or vest. Log only the added weight.
Lat Pulldown (Cable)|Lean back slightly, pull the bar to the upper chest leading with your elbows, control it back up.
Bent Over Row (Barbell)|Hinge to about 45° with a flat back. Row the bar to the lower ribs and lower under control.
Dumbbell Row|One hand and knee on the bench, flat back. Row the dumbbell to your hip and lower it fully.
Seated Cable Row - V Grip (Cable)|Sit tall, pull the handle to your belly, squeeze the shoulder blades, then let the arms stretch forward.
Seated Row (Machine)|Chest on the pad. Pull your elbows back past the torso, pause, return slowly.
T Bar Row|Hinge with a flat back and row the bar towards your chest without jerking with the hips.
Straight Arm Lat Pulldown (Cable)|Arms nearly straight, slight hip hinge. Sweep the bar down to your thighs using the lats.
Back Extension (Hyperextension)|Hips on the pad. Lower with a neutral spine, rise until your body is in line, don't overarch.
Shrug (Dumbbell)|Arms straight. Lift the shoulders straight up towards the ears, pause, lower fully. No rolling.
Shrug (Barbell)|Hold the bar at your thighs, shrug straight up, pause, lower under control.
Overhead Press (Barbell)|Brace glutes and abs. Press from the collarbone straight up and move your head through at the top.
Shoulder Press (Dumbbell)|Start at ear level, press up and slightly in, don't arch your lower back.
Shoulder Press (Machine)|Handles at shoulder height. Press up without shrugging, lower slowly.
Shoulder Press (Machine Plates)|Handles at shoulder height. Press up without shrugging, lower slowly.
Standing Military Press (Barbell)|Feet together, glutes tight. Press from the collarbone overhead and finish with the bar over mid-foot.
Arnold Press (Dumbbell)|Start with palms facing you, rotate them outward as you press overhead, reverse on the way down.
Lateral Raise (Dumbbell)|Soft elbows. Raise out to the sides to shoulder height leading with the elbows, no swinging.
Lateral Raise (Cable)|Cable from the low pulley across your body. Raise out to shoulder height, lower slowly.
Front Raise (Dumbbell)|Raise in front to shoulder height with soft elbows, lower under control.
Face Pull|Rope at upper-chest height. Pull towards your face with elbows high, rotating the hands back at the end.
Rear Delt Reverse Fly (Dumbbell)|Hinge forward with soft elbows. Raise the arms out to the sides, squeezing the rear shoulders.
Rear Delt Reverse Fly (Machine)|Chest on the pad, arms nearly straight. Sweep back to the sides, return slowly.
Rear Delt Reverse Fly (Cable)|Cross the cables, arms slightly bent. Pull out and back to shoulder level.
Reverse Fly Single Arm (Cable)|Cable across the body at shoulder height. Sweep the arm out and back, control the return.
Upright Row (Barbell)|Shoulder-width grip. Pull up to chest height with elbows leading; stop short if your shoulders pinch.
Bicep Curl (Barbell)|Elbows pinned at your sides. Curl without swinging, lower all the way.
Bicep Curl (Dumbbell)|Elbows still, palms up. Curl and squeeze, then lower slowly to a full stretch.
Bicep Curl (Cable)|Stand close to the low pulley with elbows fixed. Curl up and lower under tension.

/* Lift Log's own mascots (original characters): heaviest weight → titan, best 1RM → classic, other records → pump, a saved workout with records → champ. */
const QUIPS={titan:['The bar bent. You didn\'t.','Heavier than ever. The plates fear you.','New weight unlocked. ROAR!'],classic:['Strength like the golden days.','Timeless power. Hit a pose!','That 1RM belongs in a museum.'],pump:['That pump is going on the vlog!','More reps, more gains, more content.','Volume king! Hit subscribe on yourself.'],champ:['Champion\'s day! Take a bow.','Records broken. Trophy earned.','That workout belongs on a stage.']};
const mascotFor=k=>k==='w'?'titan':k==='orm'?'classic':'pump';
function celebrate(m,title,line){if(settings().cele===false)return false;document.querySelector('.cele')?.remove();
  const d=document.createElement('div');d.className='cele';const q=QUIPS[m][Math.floor(Math.random()*QUIPS[m].length)],cols=['#d99a00','#ffd34d','#3d84ff','#22c55e','#ef4444','#9b7bf5'];
  let cf='';for(let i=0;i<70;i++)cf+=`<i class="cf" style="left:${Math.random()*100}%;background:${cols[i%6]};width:${6+Math.random()*8}px;height:${10+Math.random()*10}px;--dx:${Math.round(Math.random()*80-40)}px;--r:${Math.round(Math.random()*720-360)}deg;animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.5}s"></i>`;
  d.innerHTML=cf+`<div class="cc"><div class="cb"><img src="${MASCOT[m]}" alt=""></div><h3>${esc(title)}</h3><p class="l">${esc(line)}</p><p class="q">“${esc(q)}”</p></div>`;
  d.addEventListener('click',()=>d.remove());document.body.appendChild(d);setTimeout(()=>d.remove(),3400);try{navigator.vibrate&&navigator.vibrate([35,70,35,70,60])}catch(e){}return true}
function markPRs(m,ei){const it=m.exercises[ei];if(!it)return;const t=ex(it.eid).type,keys=PRKEYS[t]||[];it.sets.forEach(s=>delete s.pr);
  const h=(H[it.eid]||[]).filter(e=>e.start<m.start&&e.wid!==m.editId);if(!h.length)return;
  const b={};keys.forEach(k=>b[k]=0);h.forEach(e=>e.sets.forEach(s=>{if(s.t==='w')return;const v=setM(s);keys.forEach(k=>b[k]=Math.max(b[k],v[k]))}));
  keys.forEach(k=>{let mx=b[k],at=-1;it.sets.forEach((s,si)=>{if(!s.done||s.t==='w')return;const v=setM(s)[k];if(v>mx+1e-9){mx=v;at=si}});if(at>=0)(it.sets[at].pr||(it.sets[at].pr=[])).push(k)})}
function bwAt(ts){let b=null;for(const m of MS){if(m.v.weight_kg!=null){if(m.date<=ts)return m.v.weight_kg;b=m.v.weight_kg}}return b}
const setVol=(t,s,ts)=>{if(t==='wr')return(s.kg||0)*(s.reps||0);if(!settings().bwv)return t==='wbw'?(s.kg||0)*(s.reps||0):0;if(t==='wbw'||t==='bw')return((bwAt(ts)||0)+(t==='wbw'?(s.kg||0):0))*(s.reps||0);return 0};
const wVol=w=>(w.exercises||[]).reduce((a,it)=>{const t=ex(it.eid).type;return a+it.sets.reduce((b,s)=>b+setVol(t,s,w.start),0)},0);
const pinOf=eid=>((S.docs.pins||{}).n||{})[eid]||'';
function stalled(eid){const t=ex(eid).type;if(!isVol(t))return false;const h=H[eid]||[],now=Date.now(),a=h.filter(e=>e.start>=now-28*864e5),b=h.filter(e=>e.start<now-28*864e5&&e.start>=now-84*864e5);if(a.length<3||b.length<2)return false;const best=l=>Math.max(0,...l.map(e=>Math.max(0,...e.sets.filter(x=>x.t!=='w').map(x=>setM(x).orm))));return best(a)<=best(b)+1e-9}
const wSets=w=>(w.exercises||[]).reduce((a,it)=>a+it.sets.length,0);
function liveStats(m){let vol=0,sets=0;m.exercises.forEach(it=>{const t=ex(it.eid).type;it.sets.forEach(s=>{if(!s.done)return;sets++;vol+=setVol(t,s,m.start||Date.now())})});return{vol,sets}}
const lastRest=eid=>{const h=(H[eid]||[]).find(e=>e.rest!=null&&!(e.w.src==='hevy'&&!e.rest));return h?h.rest:settings().rest};

/* ---------- UI state, sheets, dialogs ---------- */
const UI={tab:TABS.includes(location.hash.slice(1))?location.hash.slice(1):'workout',hm:'dur',wsel:11,exq:'',mk:'weight_kg',mr:'All',hv:'list',cm:0,mu:'30',fold:{},rp:'month',ro:0};
const SH=[];const repaintSet=()=>SH.forEach(x=>x.kind==='set'&&paint(x));const EDITOR={live:1,rt:1,fin:1,newex:1,set:1,pick:1,mn:1,meas:1,plate:1,orm:1,pin:1,coach:1};
const R={};
function openSheet(kind,st={}){const el=document.createElement('div');el.className='sheet'+(kind==='mn'?' dlg':'');document.body.appendChild(el);const sh={kind,st,el};SH.push(sh);paint(sh);return sh}
function paint(sh){const bd=sh.el.querySelector('.bd'),top=bd?bd.scrollTop:0;sh.el.innerHTML=`<div class="pane">${R[sh.kind](sh.st,sh)}</div>`;const nb=sh.el.querySelector('.bd');if(nb)nb.scrollTop=top;drawCharts(sh.el);if(sh.kind==='live')tick()}
function closeSheet(sh,val){const i=SH.indexOf(sh);if(i<0)return;SH.splice(i,1);sh.el.remove();if(sh.st.res){const r=sh.st.res;sh.st.res=null;r(val??null)}if(sh.kind==='live'){renderPill();wake(false)}}
const sheetOf=el=>SH.find(s=>s.el.contains(el));
const liveSheet=()=>SH.find(s=>s.kind==='live');
const menu=(title,items,msg)=>new Promise(res=>openSheet('mn',{title,items,msg,res}));
const confirmD=(title,msg,ok,danger=true)=>menu(title,[{l:ok,v:true,d:danger}],msg);
R.mn=st=>`${st.title?`<p class="dlt">${esc(st.title)}</p>`:''}${st.msg?`<p class="dlm">${esc(st.msg)}</p>`:''}${st.items.map((it,i)=>`<button class="mi ${it.d?'dng':''} ${it.on?'on':''}" data-a="mi" data-i="${i}">${esc(it.l)}</button>`).join('')}<button class="mi cx" data-a="mi" data-i="-1">Cancel</button>`;
let toastT;function toast(m,undo){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.innerHTML=esc(m)+(undo?'<button class="tu" data-a="undo">Undo</button>':'');UNDO=undo||null;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;UNDO=null},undo?6500:2800)}

function renderMain(resetScroll){const main=$('#main'),top=main.scrollTop;$('#ttl').textContent={workout:'Workout',history:'Profile',exercises:'Exercises',body:'Measurements'}[UI.tab];
  main.innerHTML=UI.tab==='workout'?vWorkout():UI.tab==='history'?vHistory():UI.tab==='body'?vBody():vExercises();main.scrollTop=resetScroll?0:top;
  $('#tabs').innerHTML=[['workout','Workout',I.dumb],['history','Profile',I.user],['exercises','Exercises',I.chart],['body','Body',I.ruler]].map(([k,l,i])=>`<button data-a="tab" data-t="${k}" class="${UI.tab===k?'on':''}" aria-label="${l}">${i}<span>${l}</span></button>`).join('');
  renderPill();drawCharts(main)}
function renderPill(){const w=$('#pillw');if(!A||liveSheet()){w.innerHTML='';return}w.innerHTML=`<button class="pill" data-a="resume"><span>${A.editId?'Editing workout':'Workout in progress'}</span>${A.editId?'':`<b data-tick>${clock(Date.now()-A.start)}</b>`}<i>Resume</i></button>`}
const weekStart=ms=>{const x=new Date(ms);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x.getTime()};
function vWorkout(){const ws=weekStart(Date.now()),wk=WS.filter(w=>w.start>=ws);
  const rc=r=>`<article class="rcard"><div class="rch"><h3>${esc(r.name)}</h3><button class="ib" data-a="rtMenu" data-id="${r.id}" aria-label="Options for ${esc(r.name)}">${I.dots}</button></div><p class="mu clamp">${esc(r.exercises.map(i=>ex(i.eid).name).join(', '))}</p><button class="btn pri wide" data-a="rtStart" data-id="${r.id}">Start routine</button></article>`;
  const fl=[...new Set(RS.map(r=>r.folder||''))].sort((a,b)=>(a===''?1:0)-(b===''?1:0)||a.localeCompare(b));
  const rs=fl.length>1||(fl[0]||'')!==''?fl.map(f=>{const list=RS.filter(r=>(r.folder||'')===f),cl=UI.fold[f];return`<button class="fh ${cl?'cl':''}" data-a="fold" data-n="${esc(f)}">${I.down}${esc(f||'Other routines')} <span>${list.length}</span></button>${cl?'':list.map(rc).join('')}`}).join(''):RS.map(rc).join('');
  const gl=settings().goal||0,{cur}=weekRuns(),C=2*Math.PI*26,pr=gl?Math.min(1,wk.length/gl):0,tt=dur(wk.reduce((a,w)=>a+w.end-w.start,0));
  return`<div class="goal">${gl?`<svg viewBox="0 0 64 64" class="ringsv" role="img" aria-label="${wk.length} of ${gl} workouts this week"><circle cx="32" cy="32" r="26" style="stroke:var(--s2)" stroke-width="7" fill="none"/><circle cx="32" cy="32" r="26" style="stroke:var(--ac)" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${(C*pr).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="38" text-anchor="middle" style="fill:var(--ink);stroke:none;font:700 19px var(--num)">${wk.length}/${gl}</text></svg>`:''}<div><b>${gl?(wk.length>=gl?'Weekly goal done':`${gl-wk.length} more to hit your goal`):`${wk.length} workout${wk.length===1?'':'s'} this week`}</b><span>${tt} trained · ${cur}-week streak</span></div><button class="btn sm" data-a="goal">${gl?'Edit':'Set goal'}</button></div>

const LEVELS=[['new','New to lifting'],['some','6 months to 2 years'],['exp','2+ years']],EQUIPS=[['gym','Full gym'],['dumbbell','Dumbbells only'],['none','No equipment']],
  GOALS=[['muscle','Build muscle'],['strength','Get stronger'],['fit','Get fit']],GENDERS=[['male','Male'],['female','Female'],['other','Other']];
const levelLabel=l=>({beginner:'Beginner',intermediate:'Intermediate',advanced:'Advanced'})[l]||'All levels',equipLabel=e=>(EQUIPS.find(x=>x[0]===e)||[e,e])[1];
/** Programs you can do with your equipment, best match first: right number of days, then level, then goal. */
function recommend(p,days){const can=p.equip==='none'?['none']:p.equip==='dumbbell'?['dumbbell','none']:['gym','dumbbell','none'];
  const ls=l=>p.exp==='new'?(({beginner:4,any:3,intermediate:0})[l]??-6):p.exp==='exp'?(({advanced:4,intermediate:4,any:2})[l]??-1):(({intermediate:4,any:3,beginner:2})[l]??-2);
  const sc=g=>-Math.abs(g.days-days)*10+ls(g.level)+(g.goal===p.goal?2:0)+(g.equip===(p.equip||'gym')?3:0);
  return PROGRAMS.filter(g=>can.includes(g.equip)).map(g=>({g,s:sc(g)})).sort((a,b)=>b.s-a.s).map(({g})=>({g,note:g.days!==days?`${g.days} days a week, the closest to your ${days}`:null}))}
/** A program's days as routines in a folder named after it; new lifters get at most 3 sets per exercise. */
function programRoutines(g,p){const now=Date.now();return g.plan.map((d,i)=>({kind:'routine',id:'r_'+rid(),name:d.name,folder:g.name,created:now+i,updated:now,
  exercises:d.ex.map(e=>{const eid='b:'+slug(e.name),t=ex(eid).type,n=p.exp==='new'?Math.min(e.sets,3):e.sets;return{eid,note:'',rest:e.rest,sets:[...Array(n)].map(()=>t==='dur'?{t:'n',sec:e.reps}:{t:'n',reps:e.reps})}})}))}

async function addProgram(sh){const st=sh.st,g=PROGRAMS.find(x=>x.id===st.pick),p=progProfile(st);if(!g)return;
  if(RS.some(r=>r.folder===g.name)&&!await confirmD(`You already have ${g.name}`,'Add another copy of its routines?','Add again'))return;
  const se=settings();put('settings',{...se,kind:'settings',profile:p,goal:se.goal>0?se.goal:g.days});
  const w=num(st.weight);if(w!=null){const kg=Math.round(fromU(w)*100)/100,t0=new Date();t0.setHours(0,0,0,0);const today=t0.getTime(),last=MS.find(x=>x.v.weight_kg!=null);
    if(!last||last.date<today||last.v.weight_kg!==kg){const m=MS.find(x=>x.date>=today),e=m?{...clone(m),v:{...m.v,weight_kg:kg}}:{kind:'measure',id:'m_'+rid(),date:today+12*3600000,v:{weight_kg:kg}};put(e.id,e)}}
  const rs=programRoutines(g,p);rs.forEach(r=>put(r.id,r));Object.keys(UI.fold).forEach(k=>{if(k!==g.name)UI.fold[k]=true});UI.fold[g.name]=false;
  closeSheet(sh);UI.tab='workout';location.hash='workout';renderMain(true);

function coachData(){const now=Date.now(),L=[],u=UNIT(),{cur,best}=weekRuns();
  L.push(`Today: ${dLong(now)}. Weights in ${u}. Workouts logged: ${WS.length}${WS.length?` (first ${dShort(WS[WS.length-1].start)}, latest ${dShort(WS[0].start)})`:''}. Weekly streak ${cur} weeks, longest ${best}. Weekly goal: ${settings().goal||'not set'}.`);
  const w0=weekStart(now);L.push('Workouts per week, oldest to newest (last 12 weeks): '+[...Array(12)].map((_,i)=>{const d=new Date(w0);d.setDate(d.getDate()-(11-i)*7);const a=d.getTime(),b=a+6048e5;return WS.filter(w=>w.start>=a&&w.start<b).length}).join(', '));
  L.push('\nLAST 30 WORKOUTS (newest first, working sets only):');
  WS.slice(0,30).forEach(w=>L.push(`- ${dShort(w.start)} "${w.title}" ${dur(w.end-w.start)}: `+w.exercises.map(it=>{const t=ex(it.eid).type;return`${ex(it.eid).name} [${it.sets.filter(q=>q.t!=='w').map(q=>fmtSet(t,q)).join(', ')}]`}).join('; ')));
  L.push('\nEXERCISE TRENDS (last 120 days):');
  Object.keys(H).map(e=>({e,h:H[e].filter(x=>x.start>=now-120*864e5)})).filter(o=>o.h.length).sort((x,y)=>y.h.length-x.h.length).slice(0,30).forEach(({e,h})=>{const t=ex(e).type,bo=l=>Math.max(0,...l.map(x=>Math.max(0,...x.sets.filter(q=>q.t!=='w').map(q=>setM(q).orm))));
    L.push(`- ${ex(e).name}: ${h.length} sessions; last ${dShort(h[0].start)} [${h[0].sets.filter(q=>q.t!=='w').map(q=>fmtSet(t,q)).join(', ')}]${isVol(t)?`; best est. 1RM last 30 days ${fmtN(toU(bo(h.filter(x=>x.start>=now-30*864e5))))}, days 31-120 ${fmtN(toU(bo(h.filter(x=>x.start<now-30*864e5))))}`:''}${stalled(e)?'; STALLED 4 weeks':''}`)});
  const cnt={};WS.filter(w=>w.start>=now-30*864e5).forEach(w=>w.exercises.forEach(it=>{const m=ex(it.eid).muscle;cnt[m]=(cnt[m]||0)+it.sets.filter(q=>q.t!=='w').length}));
  L.push('\nWORKING SETS PER MUSCLE, LAST 30 DAYS: '+(Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([m,v])=>`${m} ${v}`).join(', ')||'none'));
  L.push('\nROUTINES:'+(RS.length?'':' none'));RS.forEach(r=>L.push(`- ${r.name}${r.folder?` [${r.folder}]`:''}: `+r.exercises.map(it=>`${ex(it.eid).name} ${it.sets.length} sets`).join('; ')));
  const bw=MS.filter(m=>m.v.weight_kg!=null).slice(0,8);L.push('\nBODYWEIGHT (newest first): '+(bw.map(m=>`${dShort(m.date)} ${Wt(m.v.weight_kg)}`).join(', ')||'none logged'));
  L.push('\nEXERCISE LIBRARY (use these exact names): '+Object.values(EX).map(x=>x.name).join('; '));
  return L.join('\n')}
const coachRules=()=>`You are the coach inside Lift Log, the user's personal workout tracker. Answer their question from their training data below. Be specific and practical: cite their actual exercises, numbers and dates. Keep answers under 250 words unless they ask for a plan. Plain text: short paragraphs or lines starting with "- ", **bold** allowed, no tables or headings. You are not a medical professional: for pain or injury, tell them to see one.
If, and only if, the user asks you to create or change routines, end your answer with one fenced block in exactly this form (a JSON array):
\`\`\`routines
[{"name":"Push A","folder":"Coach","exercises":[{"exercise":"Bench Press (Barbell)","rest":120,"sets":[{"type":"warmup","weight":40,"reps":10},{"type":"normal","weight":70,"reps":8}]}]}]
\`\`\`
Use only exercise names from the EXERCISE LIBRARY, spelled exactly. Weights are in ${UNIT()}; leave "weight" out for bodyweight or cardio exercises. Set types: normal, warmup, drop, failure.

TRAINING DATA
${coachData()}`;
function md(t){const out=[];let ul=false;esc(t).split('\n').forEach(l=>{let b=l.replace(/^#+\s*(.*)$/,'**$1**').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');if(/^\s*[-•*]\s+/.test(b)){if(!ul){out.push('<ul>');ul=true}out.push('<li>'+b.replace(/^\s*[-•*]\s+/,'')+'</li>')}else{if(ul){out.push('</ul>');ul=false}if(b.trim())out.push('<p>'+b+'</p>')}});if(ul)out.push('</ul>');return out.join('')}
const stripRt=t=>t.replace(/```routines[\s\S]*?(```|$)/,'').trim();
function parseRt(t){const mm=t.match(/```routines\s*([\s\S]*?)```/);if(!mm)return null;let arr;try{arr=JSON.parse(mm[1])}catch(e){return null}if(!Array.isArray(arr))return null;
  const byName={};Object.values(EX).forEach(x=>byName[x.name.toLowerCase()]=x.id);const TY={warmup:'w',drop:'d',dropset:'d',failure:'f'};
  const out=arr.map(r=>({name:String(r.name||'Coach routine').slice(0,60),folder:r.folder?String(r.folder).slice(0,40):'Coach',exercises:(r.exercises||[]).map(e=>{const eid=byName[String(e.exercise||'').toLowerCase()];if(!eid)return null;return{eid,rest:+e.rest||lastRest(eid),note:'',sets:(e.sets||[]).slice(0,12).map(q=>{const o={t:TY[String(q.type||'').toLowerCase()]||'n'},w=num(q.weight),rp=num(q.reps);if(w!=null)o.kg=Math.round(fromU(w)*1000)/1000;if(rp!=null)o.reps=rp;return o})}}).filter(e=>e&&e.sets.length)})).filter(r=>r.exercises.length);
  return out.length?out:null}

async function coachAsk(sh,q){const st=sh.st;q=(q||'').trim();if(!q||st.busy||!SAMPLE)return;
  st.turns.push({role:'user',content:q});st.inp='';st.busy=true;st.live='';paint(sh);coachEnd(sh);st.ctl=new AbortController();
  const msgs=[{role:'user',content:coachRules()},...st.turns.filter(t=>!t.err).slice(-12).map(t=>({role:t.role,content:t.content}))];
  try{const{text}=await SAMPLE(msgs,{cache:false,signal:st.ctl.signal,onText:({text})=>{st.live=text;const e=sh.el.querySelector('#clive');if(e){const b=sh.el.querySelector('#cbody'),atEnd=b&&b.scrollHeight-b.scrollTop-b.clientHeight<80;e.innerHTML=md(stripRt(text));if(atEnd)coachEnd(sh)}}});
    st.turns.push({role:'assistant',content:text,routines:parseRt(text)})}
  catch(e){const c=e&&e.code;if(c==='cancelled'){if(e.text)st.turns.push({role:'assistant',content:e.text+'\n\n(stopped)'})}
    else{const msg={not_granted:"The coach wasn't allowed to use Claude in this view.",sampling_disabled:"Claude isn't available for this account.",rate_limited:'Too many questions just now, or your Claude usage limit is reached. Try again in a bit.',refused:"The coach can't help with that one.",prompt_too_large:'Your history is too large to send in one go.',session_expired:'Sign in to Claude again, then retry.'}[c]||'Something went wrong. Try again.';
      st.turns.push({role:'assistant',content:(e&&e.text?e.text+'\n\n':'')+msg,err:1});if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c))SAMPLE=null}}
  finally{st.busy=false;st.live='';if(SH.includes(sh)){paint(sh);coachEnd(sh)}}}

async function shrink(file){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const k=Math.min(1,1440/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.82))}finally{URL.revokeObjectURL(url)}}

(async()=>{const use=window.claude&&window.claude.use;if(!use){MODE='local';return}
