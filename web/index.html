<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e10">
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday tool with shipped-app polish
   IDEA a gym logbook: plate-stamped numerals on an iron ground
   PICTURE the live set table itself; weekly bars in history; a progress line per exercise
   COLOUR iron charcoal / chalk white ground, electric blue for action, green for done sets, gold for records
   TYPE Barlow Condensed for numbers + Inter for text
   LAYOUT one phone column (max 560px) with bottom tabs; sheets slide over full screen on every width */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d0e10);--s1:light-dark(#f2f3f5,#17191c);--s2:light-dark(#e5e7eb,#23262b);--ln:light-dark(#e3e5e9,#2a2e34);--ink:light-dark(#101215,#f3f5f8);--mu:light-dark(#5f6670,#9097a2);--ac:light-dark(#1764ff,#3d84ff);--acs:light-dark(#e7eeff,#132446);--ok:light-dark(#16a34a,#22c55e);--oks:light-dark(#e2f7e9,#0f2a1a);--wu:#e8930a;--dr:#9b7bf5;--fa:#ef4444;--pr:#d99a00;--num:'Barlow Condensed',Inter,system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
@media(min-width:600px){body{background:var(--s1)}#app{border-inline:1px solid var(--ln)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 6px max(16px,env(safe-area-inset-left))}
.top h1{margin:0;font:700 34px/1.05 var(--num);letter-spacing:-.01em}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--mu);flex:none}
.ib:hover{background:var(--s1);color:var(--ink)}
#main{flex:1;overflow-y:auto;padding:4px 16px 28px;overscroll-behavior:contain}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:500;color:var(--mu)}
.tabs button.on{color:var(--ac)}
.pill{display:flex;align-items:center;gap:10px;margin:0 12px 8px;padding:8px 8px 8px 16px;border-radius:14px;background:var(--acs);text-align:left;width:calc(100% - 24px)}
.pill span{flex:1;font-weight:600;font-size:15px}
.pill b{font:700 22px var(--num);color:var(--ac)}
.pill i{font-style:normal;background:var(--ac);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.lbl{margin:18px 0 8px;font-size:15px;font-weight:600;color:var(--mu)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;background:var(--s1);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.pri{background:var(--ac);color:#fff}
.btn.wide{width:100%}
.btn.dng{color:var(--fa);background:transparent}
.big{width:100%;min-height:56px;border-radius:14px;background:var(--s1);display:flex;align-items:center;gap:10px;padding:0 16px;font-weight:600;font-size:16px}
.big svg{color:var(--ac)}
.wkline{display:flex;gap:18px;margin-top:4px;font-size:15px;color:var(--mu)}
.wkline b{color:var(--ink);font:700 20px var(--num)}
.rcard{background:var(--s1);border-radius:16px;padding:14px 14px 14px 16px;margin-bottom:12px}
.rch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-8px -8px 0 0}
.rcard h3{margin:0;font-size:18px}
.mu{color:var(--mu)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 12px;font-size:15px}
.empty{background:var(--s1);border-radius:16px;padding:20px}
.empty p{margin:6px 0 14px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.wk{background:var(--s1);border-radius:16px;padding:14px 14px 10px;margin:4px 0 6px}
.wkh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.wkv{font:700 32px/1 var(--num)}
.wkl{font-size:14px;color:var(--mu);margin-top:2px}
.seg{display:flex;background:var(--s2);border-radius:10px;padding:3px}
.seg button{min-height:34px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--mu)}
.seg button.on{background:light-dark(var(--bg),#41464f);color:var(--ink)}
.bars{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;height:120px;margin-top:14px}
.bar{position:relative;height:100%}
.bar i{position:absolute;left:10%;right:10%;bottom:0;border-radius:4px 4px 2px 2px;background:color-mix(in srgb,var(--ac) 32%,transparent);min-height:3px}
.bar.on i{background:var(--ac)}
.bx{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-top:6px}
.mh{margin:22px 0 8px;font-size:15px;font-weight:600;color:var(--mu)}
.wc{display:block;width:100%;text-align:left;background:var(--s1);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.wc h3{margin:0;font-size:18px}
.wc .d{font-size:14px;color:var(--mu)}
.wst{display:flex;gap:22px;margin:10px 0;flex-wrap:wrap}
.wst small{display:block;font-size:13px;color:var(--mu)}
.wst b{font:600 20px/1.1 var(--num);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.wst .tr svg{width:16px;height:16px}
.wc ul{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--ln);display:grid;gap:4px;font-size:15px}
.wc li{display:flex;justify-content:space-between;gap:12px}
.wc li span:last-child{white-space:nowrap;color:var(--mu)}
.search{display:flex;align-items:center;gap:8px;background:var(--s1);border-radius:12px;padding:0 12px;margin:4px 0 10px;color:var(--mu)}
.search input{flex:1;border:0;background:transparent;height:46px;outline:0}
.xr{display:flex;width:100%;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid var(--ln);text-align:left;min-height:58px}
.xa{width:40px;height:40px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font:700 16px var(--num);color:var(--mu);flex:none}
.xr .t{flex:1}
.xr b{display:block;font-weight:600;font-size:16px}
.xr small{font-size:13px;color:var(--mu)}
.xr .r{font-size:13px;color:var(--mu);text-align:right;white-space:nowrap}
.xr.sel .xa{background:var(--ac);color:#fff}
.sheet{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;background:rgba(0,0,0,.45)}
.pane{width:100%;max-width:560px;height:100%;background:var(--bg);display:flex;flex-direction:column;animation:up .2s ease-out}
.sheet.dlg{align-items:flex-end;z-index:30}
.sheet.dlg .pane{height:auto;max-height:85%;overflow-y:auto;border-radius:20px 20px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
@media(prefers-reduced-motion:reduce){.pane{animation:none}}
.hd{display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;border-bottom:1px solid var(--ln)}
.hd h2{flex:1;margin:0;font-size:17px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .btn{min-height:38px}
.bd{flex:1;overflow-y:auto;padding:12px 16px 48px;overscroll-behavior:contain}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:10px 16px;border-bottom:1px solid var(--ln)}
.stats.s4{grid-template-columns:repeat(4,minmax(0,1fr));padding:12px 0;border:0}
.stats small{display:block;font-size:13px;color:var(--mu)}
.stats b{font:600 22px/1.15 var(--num);white-space:nowrap}
.stats .ac{color:var(--ac)}
.card{padding:12px 0 12px;border-bottom:1px solid var(--ln)}
.ch{display:flex;align-items:center;gap:8px}
.exn{flex:1;text-align:left;font-size:17px;font-weight:600;color:var(--ac);min-height:40px}
.note{width:100%;border:0;background:transparent;padding:2px 0;outline:0}
.note::placeholder{color:var(--mu)}
.rest{display:inline-flex;align-items:center;gap:6px;color:var(--ac);font-size:14px;font-weight:500;min-height:36px}
.rest svg{width:16px;height:16px}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) 72px 60px 40px;gap:6px;align-items:center;padding:3px 4px;border-radius:10px;margin-top:2px}
.row.c1{grid-template-columns:36px minmax(0,1fr) 88px 40px}
.row.rt{grid-template-columns:36px minmax(0,1fr) 72px 60px}
.row.rt.c1{grid-template-columns:36px minmax(0,1fr) 88px}
.row.th{font-size:13px;font-weight:600;color:var(--mu);text-align:center;margin-top:6px}
.row.th span:nth-child(2){text-align:left}
.row.done{background:var(--oks)}
.sl{height:36px;border-radius:8px;font:700 18px var(--num);background:var(--s1)}
.row.done .sl{background:transparent}
.t-w{color:var(--wu)}
.t-d{color:var(--dr)}
.t-f{color:var(--fa)}
.pv{height:36px;text-align:left;font-size:14px;color:var(--mu);white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:4px}
.pv span{overflow:hidden;text-overflow:ellipsis}
.row input{width:100%;height:36px;border:0;border-radius:8px;background:var(--s1);text-align:center;font:600 19px var(--num);padding:0 4px;outline-offset:0}
.row input::placeholder{color:var(--mu);opacity:.75}
.row.done input{background:transparent}
.chk{width:36px;height:36px;border-radius:8px;background:var(--s2);display:grid;place-items:center;color:var(--mu)}
.row.done .chk{background:var(--ok);color:#fff}
.tr{color:var(--pr);display:inline-flex;flex:none}
.tr svg{width:16px;height:16px}
.row:not(.pr) .tr{display:none}
.add{width:100%;min-height:40px;margin-top:8px;border-radius:10px;background:var(--s1);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.add svg{width:16px;height:16px}
.addx{margin-top:16px}
.lempty{text-align:center;padding:40px 12px 20px}
.lempty b{display:block;font-size:18px}
.lempty svg{width:44px;height:44px;color:var(--mu);margin-bottom:8px}
.rb{position:relative;display:flex;align-items:center;gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:var(--s1);border-top:1px solid var(--ln);overflow:hidden}
.rb[hidden]{display:none}
.rbp{position:absolute;left:0;top:0;height:3px;background:var(--ac);transition:width 1s linear}
.rbt{flex:1;text-align:center;font:700 32px/1 var(--num)}
.rbt small{display:block;font:500 13px Inter,sans-serif;color:var(--mu);margin-top:2px}
.wh h2{margin:4px 0 2px;font-size:24px;line-height:1.15}
.wdx{padding:14px 0 8px;border-bottom:1px solid var(--ln)}
.wdx .note2{margin:2px 0 6px;color:var(--mu);font-size:15px}
.sr{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;padding:5px 6px;font-size:16px;align-items:center;border-radius:8px}
.sr:nth-child(odd){background:var(--s1)}
.sr .n{font:700 17px var(--num);color:var(--mu);text-align:center}
.prt{display:inline-flex;align-items:center;gap:4px;color:var(--pr);font-size:13px;font-weight:600;white-space:nowrap}
.prt svg{width:15px;height:15px}
.fig{position:relative;height:220px;margin:10px 0 4px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;fill:initial;stroke:initial;stroke-width:initial}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;min-height:36px;padding:0 12px;border-radius:999px;background:var(--s1);font-size:14px;font-weight:600;color:var(--mu)}
.chip.on{background:var(--ac);color:#fff}
.big1{font:700 34px/1 var(--num);margin-top:14px}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:8px}
.rec{background:var(--s1);border-radius:12px;padding:10px 12px}
.rec small{display:block;color:var(--mu);font-size:13px}
.rec b{font:700 24px/1.2 var(--num);white-space:nowrap}
.rec span{display:block;font-size:13px;color:var(--mu)}
.h3{margin:22px 0 8px;font-size:16px}
.fld{display:block;margin:14px 0}
.fld span{display:block;font-size:14px;color:var(--mu);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;min-height:46px;border:1px solid var(--ln);background:var(--bg);border-radius:12px;padding:10px 12px}
.fld textarea{min-height:90px;resize:vertical}
.titlein{width:100%;border:0;border-bottom:1px solid var(--ln);background:transparent;font-size:22px;font-weight:600;outline:0;padding:8px 0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cb{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.cb input{width:20px;height:20px;accent-color:var(--ac)}
.warn{color:var(--wu);font-size:14px;margin:6px 0}
.dlt{margin:6px 10px 4px;font-weight:600;font-size:17px}
.dlm{margin:0 10px 10px;color:var(--mu);font-size:15px}
.mi{display:block;width:100%;min-height:50px;text-align:left;padding:0 12px;border-radius:12px;font-size:16px;font-weight:500}
.mi:hover{background:var(--s1)}
.mi.dng{color:var(--fa)}
.mi.on{color:var(--ac);font-weight:600}
.mi.cx{text-align:center;color:var(--mu);margin-top:6px;background:var(--s1)}
.pf{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
.pf[hidden]{display:none}
.box{background:var(--s1);border-radius:14px;padding:14px 16px;margin:12px 0}
.box h3{margin:0 0 4px;font-size:16px}
.box p{margin:0 0 10px;font-size:15px;color:var(--mu)}
.file{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;background:var(--ac);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.file input{position:absolute;width:1px;height:1px;opacity:0}
.st{font-size:14px;color:var(--mu);margin-top:8px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
.mgrid .fld{margin:8px 0}
.mgrid .fld span{font-size:13px}
.delta{font-size:15px;color:var(--mu);margin-top:2px}
.delta b{color:var(--ink);font-weight:600}
.mr{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--ln);text-align:left;min-height:52px}
.mr b{font:600 20px var(--num);white-space:nowrap}
.mr small{display:block;font-size:13px;color:var(--mu)}
.sl{line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sl small{font:600 13px Inter,sans-serif;color:var(--mu)}
.row input.sg::placeholder{color:var(--ac);opacity:1}
.sgn{display:flex;align-items:center;gap:6px;margin:0 0 2px;font-size:14px;color:var(--ac)}
.sgn svg{width:16px;height:16px}
.card.ssc{border-left:3px solid var(--sc);padding-left:10px}
.sst{display:block;font-size:13px;font-weight:600;color:var(--sc);margin-bottom:-4px}
.seg.hv{margin:2px 0 10px}
.seg.hv button{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .dh{font-size:13px;color:var(--mu);padding:4px 0}
.cd{aspect-ratio:1;max-height:48px;border-radius:50%;font:600 17px var(--num);display:grid;place-items:center;margin:0 auto;width:100%;max-width:48px}
.cd.on{background:var(--ac);color:#fff}
.cd.td{box-shadow:inset 0 0 0 2px var(--ac)}
.cd:disabled{cursor:default}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calh b{font-size:17px}
.mb{display:grid;grid-template-columns:7.5em minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}
.mb .mt{height:12px;background:var(--s2);border-radius:6px;overflow:hidden}
.mb .mt i{display:block;height:100%;background:var(--ac);border-radius:6px}
.mb b{font:600 18px var(--num);white-space:nowrap;text-align:right}
.mb small{display:block;font:500 13px Inter,sans-serif;color:var(--mu)}
.pt{width:100%;border-collapse:collapse;margin-top:10px;font-variant-numeric:tabular-nums}
.pt th,.pt td{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
.pt th:first-child,.pt td:first-child{text-align:left}
.pt th{font-size:13px;color:var(--mu);font-weight:600}
.pv2{display:flex;align-items:center;gap:3px;min-height:150px;padding:10px 0;overflow-x:auto}
.rod{flex:none;width:48px;height:14px;background:var(--mu);border-radius:3px}
.plw{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.pl{width:22px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.plw small{font-size:13px;color:var(--mu)}
.clr{flex:none;width:10px;height:28px;background:var(--mu);border-radius:2px}
.cmp{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--mu);margin:0 0 6px}
.fh{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;font-weight:600;font-size:16px;text-align:left;margin-top:6px}
.fh svg{transition:transform .15s}
.fh.cl svg{transform:rotate(-90deg)}
.fh span{color:var(--mu);font-weight:500;font-size:14px}
.howto{background:var(--s1);border-radius:12px;padding:10px 14px;margin:12px 0 4px}
.howto summary{cursor:pointer;font-weight:600;font-size:15px;min-height:28px}
.howto p{margin:6px 0 2px;font-size:15px}
.phs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.phs button{flex:none;width:96px;text-align:center;font-size:13px;color:var(--mu)}
.phs img,.phg img{width:96px;height:128px;object-fit:cover;border-radius:10px;display:block;background:var(--s1)}
.phg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.phg div{position:relative}
.phg button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.phg button svg{width:16px;height:16px}
.phv{display:grid;gap:8px}
.phv.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.phv figure{margin:0}
.phv img{width:100%;max-height:68vh;object-fit:contain;border-radius:12px;background:var(--s1);display:block}
.phv figcaption{font-size:14px;color:var(--mu);margin-top:4px;text-align:center}
.tog{min-width:64px}
.tog.on{background:var(--ac);color:#fff}
.row.c1.tm{grid-template-columns:36px minmax(0,1fr) 64px 40px 40px}
.row.run input{color:var(--ac)}
.tb{color:var(--ac)}
.row.run .tb{background:var(--ac);color:#fff}
.pin{display:flex;gap:8px;align-items:flex-start;font-size:14px;background:var(--acs);border-radius:10px;padding:7px 10px;margin:4px 0 6px}
.pin svg{width:16px;height:16px;margin-top:2px;color:var(--ac)}
.pin span{flex:1;white-space:pre-wrap}
.stl{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--wu);margin:2px 0 4px}
.stl svg{width:16px;height:16px}
.goal{display:flex;align-items:center;gap:14px;background:var(--s1);border-radius:16px;padding:12px 14px;margin-top:4px}
.goal>div{flex:1}
.goal b{display:block;font-size:16px}
.goal span{font-size:14px;color:var(--mu)}
.ringsv{width:64px;height:64px;flex:none}
.bmap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;max-width:340px;margin:12px auto 4px}
.bmap figure{margin:0;text-align:center}
.bmap svg{width:100%;height:auto;stroke:none}
.bmap figcaption{font-size:13px;color:var(--mu)}
.blg{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--mu);margin-bottom:6px}
.blg i{display:block;width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--s2),var(--ac))}
.rph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 6px}
.rph b{font-size:18px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:8px}
.rgrid div{background:var(--s1);border-radius:12px;padding:10px 12px}
.rgrid small{display:block;font-size:13px;color:var(--mu)}
.rgrid b{font:700 24px/1.2 var(--num);white-space:nowrap}
.rgrid span{display:block;font-size:13px;color:var(--mu)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin:4px 0}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:12px;height:12px;border-radius:50%;display:block}
.msg{padding:10px 14px;border-radius:14px;margin:8px 0;max-width:92%;font-size:15px;line-height:1.5}
.msg.user{background:var(--ac);color:#fff;margin-left:auto;white-space:pre-wrap;width:fit-content}
.msg.assistant{background:var(--s1)}
.msg p{margin:0 0 8px}
.msg p:last-child{margin-bottom:0}
.msg ul{margin:0 0 8px;padding-left:20px}
.msg .btn{margin-top:8px}
.cf{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
.cf textarea{flex:1;min-height:46px;max-height:140px;border:1px solid var(--ln);border-radius:12px;padding:11px 12px;background:var(--bg);resize:none}
.tu{color:var(--ac);font-weight:700;margin-left:10px;padding:4px 6px;min-height:32px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:60;max-width:90vw;text-align:center}
@media(max-width:380px){.row{grid-template-columns:32px minmax(0,1fr) 64px 54px 38px;gap:4px}.row.rt{grid-template-columns:32px minmax(0,1fr) 64px 54px}.stats.s4{grid-template-columns:repeat(2,minmax(0,1fr))}}

function index(){
  const d=Object.values(S.docs);
  WS=d.filter(x=>x&&x.kind==='workout').sort((a,b)=>b.start-a.start);
  MS=d.filter(x=>x&&x.kind==='measure').sort((a,b)=>b.date-a.date);

  EX={};LIB.forEach(x=>EX[x.id]=x);d.filter(x=>x&&x.kind==='exercise').forEach(x=>EX[x.id]={...x,custom:true});
  H={};PRM={};const run={};
  [...WS].reverse().forEach(w=>{const pm={n:0,m:{}};PRM[w.id]=pm;
    (w.exercises||[]).forEach((it,ei)=>{const t=ex(it.eid).type,keys=PRKEYS[t]||[],best=run[it.eid];
      (H[it.eid]||(H[it.eid]=[])).push({wid:w.id,start:w.start,sets:it.sets||[],rest:it.rest,w});
      const mx={},at={};keys.forEach(k=>{mx[k]=0;at[k]=-1});
      (it.sets||[]).forEach((s,si)=>{if(s.t==='w')return;const m=setM(s);keys.forEach(k=>{if(m[k]>mx[k]){mx[k]=m[k];at[k]=si}})});
      if(best)keys.forEach(k=>{if(at[k]>=0&&mx[k]>best[k]+1e-9){const key=ei+':'+at[k];(pm.m[key]||(pm.m[key]=[])).push(k)}});
      run[it.eid]=best?Object.fromEntries(keys.map(k=>[k,Math.max(best[k],mx[k])])):mx});
    pm.n=Object.keys(pm.m).length});
  Object.values(H).forEach(a=>a.reverse());
}
const prevSets=(eid,start,excl)=>((H[eid]||[]).find(e=>e.start<start&&e.wid!==excl)||{}).sets||null;
function markPRs(m,ei){const it=m.exercises[ei];if(!it)return;const t=ex(it.eid).type,keys=PRKEYS[t]||[];it.sets.forEach(s=>delete s.pr);
  const h=(H[it.eid]||[]).filter(e=>e.start<m.start&&e.wid!==m.editId);if(!h.length)return;
  const b={};keys.forEach(k=>b[k]=0);h.forEach(e=>e.sets.forEach(s=>{if(s.t==='w')return;const v=setM(s);keys.forEach(k=>b[k]=Math.max(b[k],v[k]))}));
  keys.forEach(k=>{let mx=b[k],at=-1;it.sets.forEach((s,si)=>{if(!s.done||s.t==='w')return;const v=setM(s)[k];if(v>mx+1e-9){mx=v;at=si}});if(at>=0)(it.sets[at].pr||(it.sets[at].pr=[])).push(k)})}
function bwAt(ts){let b=null;for(const m of MS){if(m.v.weight_kg!=null){if(m.date<=ts)return m.v.weight_kg;b=m.v.weight_kg}}return b}
const setVol=(t,s,ts)=>{if(t==='wr')return(s.kg||0)*(s.reps||0);if(!settings().bwv)return t==='wbw'?(s.kg||0)*(s.reps||0):0;if(t==='wbw'||t==='bw')return((bwAt(ts)||0)+(t==='wbw'?(s.kg||0):0))*(s.reps||0);return 0};

function coachData(){const now=Date.now(),L=[],u=UNIT(),{cur,best}=weekRuns();
  L.push(`Today: ${dLong(now)}. Weights in ${u}. Workouts logged: ${WS.length}${WS.length?` (first ${dShort(WS[WS.length-1].start)}, latest ${dShort(WS[0].start)})`:''}. Weekly streak ${cur} weeks, longest ${best}. Weekly goal: ${settings().goal||'not set'}.`);
  const w0=weekStart(now);L.push('Workouts per week, oldest to newest (last 12 weeks): '+[...Array(12)].map((_,i)=>{const d=new Date(w0);d.setDate(d.getDate()-(11-i)*7);const a=d.getTime(),b=a+6048e5;return WS.filter(w=>w.start>=a&&w.start<b).length}).join(', '));
  L.push('\nLAST 30 WORKOUTS (newest first, working sets only):');
  WS.slice(0,30).forEach(w=>L.push(`- ${dShort(w.start)} "${w.title}" ${dur(w.end-w.start)}: `+w.exercises.map(it=>{const t=ex(it.eid).type;return`${ex(it.eid).name} [${it.sets.filter(q=>q.t!=='w').map(q=>fmtSet(t,q)).join(', ')}]`}).join('; ')));
  L.push('\nEXERCISE TRENDS (last 120 days):');
  Object.keys(H).map(e=>({e,h:H[e].filter(x=>x.start>=now-120*864e5)})).filter(o=>o.h.length).sort((x,y)=>y.h.length-x.h.length).slice(0,30).forEach(({e,h})=>{const t=ex(e).type,bo=l=>Math.max(0,...l.map(x=>Math.max(0,...x.sets.filter(q=>q.t!=='w').map(q=>setM(q).orm))));
    L.push(`- ${ex(e).name}: ${h.length} sessions; last ${dShort(h[0].start)} [${h[0].sets.filter(q=>q.t!=='w').map(q=>fmtSet(t,q)).join(', ')}]${isVol(t)?`; best est. 1RM last 30 days ${fmtN(toU(bo(h.filter(x=>x.start>=now-30*864e5))))}, days 31-120 ${fmtN(toU(bo(h.filter(x=>x.start<now-30*864e5))))}`:''}${stalled(e)?'; STALLED 4 weeks':''}`)});
  const cnt={};WS.filter(w=>w.start>=now-30*864e5).forEach(w=>w.exercises.forEach(it=>{const m=ex(it.eid).muscle;cnt[m]=(cnt[m]||0)+it.sets.filter(q=>q.t!=='w').length}));
  L.push('\nWORKING SETS PER MUSCLE, LAST 30 DAYS: '+(Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([m,v])=>`${m} ${v}`).join(', ')||'none'));
  L.push('\nROUTINES:'+(RS.length?'':' none'));RS.forEach(r=>L.push(`- ${r.name}${r.folder?` [${r.folder}]`:''}: `+r.exercises.map(it=>`${ex(it.eid).name} ${it.sets.length} sets`).join('; ')));
  const bw=MS.filter(m=>m.v.weight_kg!=null).slice(0,8);L.push('\nBODYWEIGHT (newest first): '+(bw.map(m=>`${dShort(m.date)} ${Wt(m.v.weight_kg)}`).join(', ')||'none logged'));
  L.push('\nEXERCISE LIBRARY (use these exact names): '+Object.values(EX).map(x=>x.name).join('; '));
  return L.join('\n')}
const coachRules=()=>`You are the coach inside Lift Log, the user's personal workout tracker. Answer their question from their training data below. Be specific and practical: cite their actual exercises, numbers and dates. Keep answers under 250 words unless they ask for a plan. Plain text: short paragraphs or lines starting with "- ", **bold** allowed, no tables or headings. You are not a medical professional: for pain or injury, tell them to see one.
If, and only if, the user asks you to create or change routines, end your answer with one fenced block in exactly this form (a JSON array):
\`\`\`routines
[{"name":"Push A","folder":"Coach","exercises":[{"exercise":"Bench Press (Barbell)","rest":120,"sets":[{"type":"warmup","weight":40,"reps":10},{"type":"normal","weight":70,"reps":8}]}]}]
\`\`\`
Use only exercise names from the EXERCISE LIBRARY, spelled exactly. Weights are in ${UNIT()}; leave "weight" out for bodyweight or cardio exercises. Set types: normal, warmup, drop, failure.

TRAINING DATA
${coachData()}`;
function md(t){const out=[];let ul=false;esc(t).split('\n').forEach(l=>{let b=l.replace(/^#+\s*(.*)$/,'**$1**').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');if(/^\s*[-•*]\s+/.test(b)){if(!ul){out.push('<ul>');ul=true}out.push('<li>'+b.replace(/^\s*[-•*]\s+/,'')+'</li>')}else{if(ul){out.push('</ul>');ul=false}if(b.trim())out.push('<p>'+b+'</p>')}});if(ul)out.push('</ul>');return out.join('')}
const stripRt=t=>t.replace(/```routines[\s\S]*?(```|$)/,'').trim();
function parseRt(t){const mm=t.match(/```routines\s*([\s\S]*?)```/);if(!mm)return null;let arr;try{arr=JSON.parse(mm[1])}catch(e){return null}if(!Array.isArray(arr))return null;
  const byName={};Object.values(EX).forEach(x=>byName[x.name.toLowerCase()]=x.id);const TY={warmup:'w',drop:'d',dropset:'d',failure:'f'};
  const out=arr.map(r=>({name:String(r.name||'Coach routine').slice(0,60),folder:r.folder?String(r.folder).slice(0,40):'Coach',exercises:(r.exercises||[]).map(e=>{const eid=byName[String(e.exercise||'').toLowerCase()];if(!eid)return null;return{eid,rest:+e.rest||lastRest(eid),note:'',sets:(e.sets||[]).slice(0,12).map(q=>{const o={t:TY[String(q.type||'').toLowerCase()]||'n'},w=num(q.weight),rp=num(q.reps);if(w!=null)o.kg=Math.round(fromU(w)*1000)/1000;if(rp!=null)o.reps=rp;return o})}}).filter(e=>e&&e.sets.length)})).filter(r=>r.exercises.length);
  return out.length?out:null}
const CQ=['How has my training gone this month?','Which lifts have stalled, and what should I change?','Am I training all my muscles evenly?','Build me a 4-day upper/lower split from my history'];

  <div class="bd" id="cbody">${!SAMPLE?'<p class="mu">The coach needs this page opened inside Claude. It uses your own Claude account to answer.</p>':''}
  ${st.turns.length?'':`<p class="mu">Ask about your training. The coach reads your workouts, routines and measurements to answer, and can build routines for you.</p><div class="chips" style="flex-wrap:wrap">${CQ.map(q=>`<button class="chip" data-a="cq" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`}
  ${st.turns.map((t,i)=>`<div class="msg ${t.role}">${t.role==='user'?esc(t.content):md(stripRt(t.content))}${t.routines?`<button class="btn sm ${t.added?'':'pri'}" data-a="caddrt" data-i="${i}" ${t.added?'disabled':''}>${t.added?'Added':`Add ${t.routines.length} routine${t.routines.length>1?'s':''}: ${esc(t.routines.map(r=>r.name).join(', '))}`}</button>`:''}</div>`).join('')}

const coachEnd=sh=>{const b=sh.el.querySelector('#cbody');if(b)b.scrollTop=b.scrollHeight};
async function coachAsk(sh,q){const st=sh.st;q=(q||'').trim();if(!q||st.busy||!SAMPLE)return;
  st.turns.push({role:'user',content:q});st.inp='';st.busy=true;st.live='';paint(sh);coachEnd(sh);st.ctl=new AbortController();
  const msgs=[{role:'user',content:coachRules()},...st.turns.filter(t=>!t.err).slice(-12).map(t=>({role:t.role,content:t.content}))];
  try{const{text}=await SAMPLE(msgs,{cache:false,signal:st.ctl.signal,onText:({text})=>{st.live=text;const e=sh.el.querySelector('#clive');if(e){const b=sh.el.querySelector('#cbody'),atEnd=b&&b.scrollHeight-b.scrollTop-b.clientHeight<80;e.innerHTML=md(stripRt(text));if(atEnd)coachEnd(sh)}}});
    st.turns.push({role:'assistant',content:text,routines:parseRt(text)})}
  catch(e){const c=e&&e.code;if(c==='cancelled'){if(e.text)st.turns.push({role:'assistant',content:e.text+'\n\n(stopped)'})}
    else{const msg={not_granted:"The coach wasn't allowed to use Claude in this view.",sampling_disabled:"Claude isn't available for this account.",rate_limited:'Too many questions just now, or your Claude usage limit is reached. Try again in a bit.',refused:"The coach can't help with that one.",prompt_too_large:'Your history is too large to send in one go.',session_expired:'Sign in to Claude again, then retry.'}[c]||'Something went wrong. Try again.';
      st.turns.push({role:'assistant',content:(e&&e.text?e.text+'\n\n':'')+msg,err:1});if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c))SAMPLE=null}}
  finally{st.busy=false;st.live='';if(SH.includes(sh)){paint(sh);coachEnd(sh)}}}

const PLATES={kg:[25,20,15,10,5,2.5,1.25],lb:[45,35,25,10,5,2.5]},BARS={kg:[20,15,10,0],lb:[45,35,15,0]};
const PCOL={25:'#d6312b',20:'#2a62d4',15:'#e8b100',10:'#2f9e44',5:'#e9ecef',2.5:'#343a40',1.25:'#adb5bd',45:'#2a62d4',35:'#e8b100'};
function plateRes(st){const u=UNIT(),w=num(st.w),bar=st.bar;if(!w)return'<p class="mu">Enter the total weight you want on the bar.</p>';if(w<bar)return`<p class="mu">That's lighter than the bar (${bar} ${u}).</p>`;
  let side=(w-bar)/2;const out=[];for(const p of PLATES[u])while(side>=p-1e-9){out.push(p);side-=p}const left=r2(side*2),big=PLATES[u][0];
  return`<div class="pv2" aria-label="Plates on each side"><span class="rod"></span>${out.map(p=>`<span class="plw"><span class="pl" style="height:${36+p/big*96}px;background:${PCOL[p]||'#888'}"></span><small>${p}</small></span>`).join('')}<span class="clr"></span></div>
  <p><b>Each side:</b> ${out.length?out.join(' + ')+` ${u}`:'no plates, just the bar'}</p>${left>0?`<p class="warn">Can't load exactly ${fmtN(w)} ${u} with standard plates. Closest below: ${fmtN(r2(w-left))} ${u}.</p>`:''}`}

function ormRes(st){const w=num(st.w),r=num(st.r),u=UNIT();if(!w||!r)return'<p class="mu">Enter a weight and how many reps you did with it.</p>';if(r>30)return'<p class="mu">Estimates get unreliable past 30 reps.</p>';
  const r1=x=>Math.round(x*10)/10,ep=r===1?w:w*(1+r/30),br=r===1?w:w*36/(37-r),one=(ep+br)/2;

function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.length>1||r[0])}

(async()=>{const use=window.claude&&window.claude.use;if(!use){MODE='local';return}
