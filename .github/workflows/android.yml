name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: composeApp/build/reports/tests/
      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
      - name: Decode upload key
        env:
          KEY_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; else echo "No upload key secret; the release bundle will be unsigned."; fi
      - name: Build release bundle (minified)
        run: ./gradlew :composeApp:bundleRelease --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: lift-log-release-aab
          path: composeApp/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: lift-log-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk LiftLog-debug.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest build" --notes "Debug APK built automatically from main. Install on Android: download LiftLog-debug.apk and open it."
          gh release upload latest LiftLog-debug.apk --clobber
      - name: Attach the signed bundle to a draft release (visible only to repo owners)
        if: github.ref == 'refs/heads/main' && env.UPLOAD_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp composeApp/build/outputs/bundle/release/composeApp-release.aab LiftLog-release.aab
          gh release view play-upload >/dev/null 2>&1 || gh release create play-upload --draft --title "Play upload" --notes "Signed release bundle for Play Console. Draft: not public."
          gh release upload play-upload LiftLog-release.aab --clobber

